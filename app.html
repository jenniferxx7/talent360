/* ===== 配色：104 HA 設計公版（react-ha-v2 palette / colors / typography） ===== */
:root{
  --c-primary:#00afb8;        /* brand-400 產品主色 */
  --c-primary-dark:#014a50;   /* brand-700 */
  --c-primary-light:#e6f9fa;  /* brand-50 產品背景色 */
  --c-heading:#292929;        /* gray-800 主要文字 */
  --c-accent:#1654b9;         /* link-300 */
  --c-accent-light:#dbe8ff;   /* link-50 */
  --c-warn:#ff7800;           /* warning-400 */
  --c-warn-light:#ffeedf;     /* warning-50 */
  --c-danger:#ea475b;         /* error-300 */
  --c-danger-light:#ffe9ec;   /* error-50 */
  --c-ok:#509e1f;             /* success-400 */
  --c-ok-light:#e9f6dc;       /* success-50 */
  --c-purple:#78269f;         /* selected-300 */
  --c-purple-light:#ede7f7;   /* selected-50 */
  --c-bg:#f3f3f3;             /* gray-100 */
  --c-surface:#ffffff;
  --c-border:#dddddd;         /* gray-300 */
  --c-text:#292929;           /* gray-800 */
  --c-text-sub:#7e7e7e;       /* gray-600 */
  --radius:8px;
  --shadow:0 2px 4px 0 rgba(41,41,41,.1); /* shadow-xs */
  --font:Arial,"PingFang TC","Microsoft JhengHei",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--c-text);background:var(--c-bg);line-height:1.6;font-size:15px}
a{color:var(--c-primary)}
button,select,input{font-family:inherit;font-size:14px}
button{cursor:pointer}

/* 頂部列 */
/* 品牌列（對齊公版 header-navigation：白底品牌列＋模組頁籤列） */
.appbar{position:sticky;top:0;z-index:40;height:60px;background:var(--c-surface);color:var(--c-text);display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid #eeeeee}
.appbar .logo{display:flex;align-items:center;gap:14px;white-space:nowrap;text-decoration:none}
.appbar .logo .mark{display:block;flex:none}
.appbar .logo .mk{height:30px;width:58px;overflow:hidden}
.appbar .logo .mk img{display:block;height:42px;width:auto;max-width:none;margin-top:-6px}
.appbar .logo .prod{font-weight:700;font-size:22px;line-height:1;color:#6f6f6f;letter-spacing:.5px}
.appbar .co{font-size:17px;color:var(--c-heading);white-space:nowrap;padding-left:14px;border-left:1px solid #a9a9a9;line-height:1.2}
.appbar .sp{flex:1}
.appbar a.why{color:var(--c-accent);font-size:13px;text-decoration:none;white-space:nowrap}
.appbar a.why:hover{text-decoration:underline}
.demo{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c-text-sub);border:1px dashed #a9a9a9;background:#f3f3f3;border-radius:4px;padding:3px 8px;white-space:nowrap}
.demo .tag{font-weight:700;letter-spacing:.05em;border:1px solid var(--c-border);background:#fff;border-radius:4px;padding:0 4px}
.demo select{font-size:13px;padding:2px 6px}
.who{position:relative;white-space:nowrap}
.who-btn{display:flex;align-items:center;gap:8px;border:0;background:none;font-size:14px;color:var(--c-text);padding:4px 6px;border-radius:4px}
.who-btn:hover{background:var(--c-bg)}
.who-btn .caret{font-size:11px;color:var(--c-text-sub)}
.who-menu{position:absolute;right:0;top:44px;z-index:50;min-width:220px;background:#fff;border:1px solid var(--c-border);border-radius:4px;box-shadow:0 2px 8px 0 rgba(41,41,41,.15);padding:6px}
.who-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;background:none;padding:8px 10px;border-radius:4px;text-align:left;font-size:14px;color:var(--c-text)}
.who-menu button:hover{background:var(--c-primary-light)}
.who-menu button.on b{color:var(--c-primary)}
.who-menu button span{font-size:12px;color:var(--c-text-sub)}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--c-primary-light);color:var(--c-primary);display:flex;align-items:center;justify-content:center;font-weight:900}

/* 版面 */
.shell{display:block;min-height:calc(100vh - 60px)}
/* 模組頁籤列：底線樣式，當前頁籤主色＋底線；第二層為該模組的功能 */
.side{position:sticky;top:60px;z-index:30;background:var(--c-surface);border-bottom:1px solid var(--c-border);box-shadow:0 2px 4px 0 rgba(41,41,41,.06)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px}
.tab-item{position:relative}
.tab-item>a{display:block;padding:12px 16px 9px;font-size:17px;color:var(--c-text);text-decoration:none;border-bottom:4px solid transparent;white-space:nowrap}
.tab-item:hover>a,.tab-item:focus-within>a{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.tab-item>a.on{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.drop{display:none;position:absolute;left:0;top:100%;z-index:45;min-width:180px;background:#fff;border:1px solid var(--c-border);border-radius:4px;box-shadow:0 2px 8px 0 rgba(41,41,41,.15);padding:6px}
.tab-item:hover .drop,.tab-item:focus-within .drop{display:block}
.drop a{display:block;padding:8px 12px;border-radius:4px;font-size:14px;color:var(--c-text);text-decoration:none;white-space:nowrap}
.drop a:hover{background:var(--c-bg);color:var(--c-primary)}
.drop a.on{background:var(--c-primary-light);color:var(--c-primary);font-weight:700}
.lk{font-size:12px;color:var(--c-text-sub)}
main{padding:24px 28px 48px;min-width:0;max-width:1600px;margin:0 auto}

.crumb{font-size:13px;color:var(--c-text-sub);margin-bottom:4px}
.crumb a{color:var(--c-text-sub);text-decoration:none}
.ph{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:26px;color:var(--c-heading);font-weight:900}
.ph p{color:var(--c-text-sub);font-size:14px}
.solves{font-size:13px;background:var(--c-danger-light);color:var(--c-danger);border-radius:999px;padding:4px 12px;font-weight:700}

/* 卡片 */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{font-size:16px;color:var(--c-heading)}
.mt{margin-top:16px}

/* 資料來源標示 */
.srcs{font-size:12px;color:var(--c-text-sub)}
.srcs a{color:var(--c-text-sub);text-decoration:none;border-bottom:1px dotted var(--c-text-sub)}
.srcs a:hover{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.card-src{margin-top:12px;padding-top:8px;border-top:1px solid #eeeeee}
.kpi .l,.mini-l{display:flex;align-items:center;gap:4px}
.tip{position:relative;top:-1px;vertical-align:middle;flex:none;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid #a9a9a9;color:#7e7e7e;font-size:10px;font-weight:700;line-height:1;cursor:help}
.tip:hover,.tip:focus{border-color:var(--c-primary);color:var(--c-primary);outline:none}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);width:230px;background:#292929;color:#fff;font-size:12px;font-weight:400;line-height:1.5;padding:8px 10px;border-radius:4px;z-index:60;white-space:normal;text-align:left;box-shadow:0 2px 8px 0 rgba(41,41,41,.15)}

.kpi .l{font-size:13px;color:var(--c-text-sub)}
.kpi .n{font-size:28px;font-weight:900;color:var(--c-heading);line-height:1.3}
.kpi .s{font-size:12px}
.kpi .from{font-size:11px;color:var(--c-text-sub);margin-top:6px}
.up{color:var(--c-ok)}.down{color:var(--c-warn)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 64px;align-items:center;gap:10px;font-size:14px}
.bar .track{height:10px;background:var(--c-primary-light);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--c-primary);border-radius:5px;width:0;transition:width .8s}
.bar .fill.acc{background:var(--c-accent)}
.bar .fill.warn{background:var(--c-warn)}
.bar .v{text-align:right;color:var(--c-text-sub)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;background:#f3f3f3;color:var(--c-text-sub);font-weight:700;padding:10px;border-bottom:1px solid var(--c-border);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid #eeeeee;vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#e6f9fa}
.tbl-wrap{overflow-x:auto}

.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.b-ok{background:var(--c-ok-light);color:var(--c-ok)}
.b-warn{background:var(--c-warn-light);color:var(--c-warn)}
.b-danger{background:var(--c-danger-light);color:var(--c-danger)}
.b-blue{background:var(--c-primary-light);color:var(--c-primary)}
.b-acc{background:var(--c-accent-light);color:var(--c-accent)}
.b-pur{background:var(--c-purple-light);color:var(--c-purple)}
.lock{color:var(--c-text-sub);font-size:13px}
.lock::before{content:"🔒 "}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:8px 14px;font-weight:700;text-decoration:none;font-size:14px;white-space:nowrap}
.btn-blue{background:var(--c-primary);color:#fff}
.btn-line{background:#fff;color:var(--c-primary);border-color:var(--c-primary)}
.btn-sm{padding:4px 10px;font-size:13px}

.ai{background:linear-gradient(90deg,#e6f9fa,#f3f7ff);border:1px solid #c5f3f5;border-radius:10px;padding:14px 16px;font-size:14px}
.ai .t{font-weight:700;color:var(--c-primary);margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.ai .t span{font-weight:400;font-size:12px;color:var(--c-text-sub)}

.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
select,input[type=text]{padding:7px 10px;border:1px solid var(--c-border);border-radius:6px;background:#fff}
select:disabled{background:#f3f3f3;color:var(--c-text-sub)}

/* 首頁 */
.hello{font-size:22px;font-weight:900;color:var(--c-heading)}
.qcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--c-text);border:1px solid var(--c-border);background:#fff;border-radius:var(--radius);padding:16px;transition:.2s}
.qcard:hover{border-color:var(--c-primary);transform:translateY(-2px);box-shadow:0 2px 8px 0 rgba(41,41,41,.15)}
.qcard .q{font-weight:700}
.qcard .to{font-size:13px;color:var(--c-primary);font-weight:700;margin-top:auto}
.qcard .no{font-size:12px;color:var(--c-danger);font-weight:700}
.vcard{border:1px solid var(--c-border);background:#fff;border-radius:var(--radius);padding:18px}
.vcard h3{font-size:18px;color:var(--c-heading);margin-bottom:4px}
.vcard p{font-size:13px;color:var(--c-text-sub);margin-bottom:10px}
.vcard a{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--c-text);background:var(--c-bg);margin-top:6px;font-size:14px}
.vcard a:hover{background:var(--c-primary-light);color:var(--c-primary)}
.sync{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--c-border)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c-ok);margin-right:6px}

/* 員工畫像 */
.phead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--c-primary-light);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--c-primary)}
.phead .nm{font-size:22px;font-weight:900}
.phead .meta{color:var(--c-text-sub);font-size:14px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.circle{display:flex;flex-direction:column;gap:8px}
.circle div{border-radius:10px;padding:10px 14px;font-size:14px}
.circle .why{background:var(--c-purple-light)}
.circle .how{background:var(--c-accent-light)}
.circle .what{background:var(--c-primary-light)}
.circle b{display:block;font-size:12px}
.perfrow{display:flex;gap:10px}
.perfrow div{flex:1;border:1px solid var(--c-border);border-radius:10px;padding:10px;text-align:center}
.perfrow b{display:block;font-size:22px;color:var(--c-heading)}
.perfrow span{font-size:12px;color:var(--c-text-sub)}
.course{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--c-border);border-radius:8px;padding:9px 12px;font-size:14px;margin-top:8px}

/* 比較 */
.cmp{display:grid;gap:14px}
.ccard{border:1px solid var(--c-border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;background:#fff}
.ccard.best{border:2px solid var(--c-primary)}
.ccard .nm{font-size:17px;font-weight:700}
.ccard .row{display:flex;justify-content:space-between;gap:8px;border-top:1px dashed var(--c-border);padding-top:6px}
.ccard .row span:first-child{color:var(--c-text-sub)}
.fit{font-size:28px;font-weight:900;color:var(--c-primary)}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pick{border:1px solid var(--c-border);border-radius:999px;padding:4px 12px;background:#fff;font-size:13px}
.pick.on{background:var(--c-primary);border-color:var(--c-primary);color:#fff}

.locked{text-align:center;padding:64px 20px;color:var(--c-text-sub)}
.locked .ic{font-size:44px}
.locked b{display:block;font-size:20px;color:var(--c-text);margin:8px 0}

.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;pointer-events:none}
.toast{background:var(--c-primary-dark);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.3s}
.toast.show{opacity:1}
.fade{animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .tabs{padding-left:12px;padding-right:12px;gap:18px}
  .appbar{padding:0 12px;gap:10px}
  .side a{white-space:nowrap}
  .g2,.g3{grid-template-columns:1fr}
  .appbar .co,.appbar a.why{display:none}
  main{padding:16px}
}
@media (max-width:560px){.g4,.g5{grid-template-columns:1fr}.bar{grid-template-columns:96px 1fr 52px}.who .nmtxt{display:none}}
</style>

function srcs(keys){
  return `<div class="srcs">來源：${keys.map(k=>{const a=APIS[k];
    return `<a href="${a.url}" target="_blank" rel="noopener" title="前往${a.prod}查看完整資料">${a.prod}</a>`}).join('、')}</div>`;

function card(title, keys, body, cls=''){
  return `<div class="card ${cls}"><div class="card-h"><h3>${title}</h3></div>${body}${keys&&keys.length?`<div class="card-src">${srcs(keys)}</div>`:''}</div>`;
}
function ai(text, keys){

}
function bar(label,val,txt,cls=''){
  return `<div class="bar"><span>${label}</span><span class="track"><span class="fill ${cls}" data-w="${Math.max(0,Math.min(100,val))}"></span></span><span class="v">${txt}</span></div>`;
}
const TIPS = {
  '在職人數':'統計日當天在職的員工人數（不含已離職、留職停薪）',
  '高潛力人才':'近 2 年績效皆 A 以上，且測評潛力評級為「高」的在職員工數；占比＝高潛力人才數 ÷ 在職員工數（12.6%）',

  '績效 A 以上':'最近一次考核為 A 以上的在職員工數 ÷ 在職員工數 × 100%',

const tipHtml = t => t ? `<span class="tip" tabindex="0" role="img" aria-label="計算方式：${t}" data-tip="${t}">!</span>` : '';

}
function header(crumb,title,desc,solve){

function locked(){

function riskBadge(lv){return `<span class="badge ${lv==='高'?'b-danger':lv==='中'?'b-warn':'b-ok'}">${lv}風險</span>`}
function potBadge(p){return `<span class="badge ${p==='高'?'b-ok':p==='中'?'b-blue':'b-warn'}">潛力${p}</span>`}
function topN(p,n){return p.radar.map((v,i)=>[DIMS[i],v]).sort((a,b)=>b[1]-a[1]).slice(0,n)}
function lowN(p,n){return p.radar.map((v,i)=>[DIMS[i],v]).sort((a,b)=>a[1]-b[1]).slice(0,n)}
function fitScore(p,pos){const w=POSITIONS.find(x=>x.id===pos).w;return Math.round(p.radar.reduce((s,v,i)=>s+v*w[i],0))}

      ${card('各部門人數與離職率',['org'],`<div class="tbl-wrap"><table class="t"><thead><tr><th>部門</th><th>人數</th><th>年度離職率</th></tr></thead><tbody>

      ${card('高績效者的背景',['org'],`<div class="bars">${bar('年資 3–7 年',62,'62%','acc')}${bar('曾跨部門輪調',45,'45%','acc')}${bar('內部晉升',38,'38%','acc')}${bar('年資 1 年以下',8,'8%','acc')}</div>`)}

      ${ai('公司的高績效者多為「分析驅動、自我要求高、願意跨部門合作」的人，且多在年資 3–7 年時表現最好。建議招募時除了專業能力，也把協作經驗納入評估；內部可優先培育年資 3 年以上的高潛力員工。',['assess','perf','org'])}
    </div>`;
  },

  'dept-overview'(){
    const list = visibleDepts();
    if(!list.find(d=>d.name===S.dept)) S.dept = list[0].name;
    const d = DEPTS.find(x=>x.name===S.dept);
    const mem = PEOPLE.filter(p=>p.dept===d.name);
    return header('部門分析 › 部門總覽','部門總覽','部門的人才組成、職能分布與人才分群。')+
    `<div class="filters">部門：<select id="deptSel" ${isMgr()?'disabled':''}>${list.map(x=>`<option ${x.name===d.name?'selected':''}>${x.name}</option>`).join('')}</select>${isMgr()?'<span class="lock">部門主管只能檢視自己部門</span>':''}</div>

        <tr><td><span class="badge b-blue">穩定貢獻</span></td><td>表現穩定，持續發展</td><td><b>${d.keep}</b> 人</td></tr>
        <tr><td><span class="badge b-warn">待觀察</span></td><td>績效或潛力需提升</td><td><b>${d.watch}</b> 人</td></tr>
        <tr class="click" data-go="dept-risk"><td><span class="badge b-danger">留任風險</span></td><td>出現離職訊號（點選查看）</td><td><b>${d.risk}</b> 人</td></tr></tbody></table>`)}
    </div>
    ${mem.length?`<div class="mt">${card('部門成員畫像（範例）',['org','perf'],`<div class="tbl-wrap"><table class="t"><thead><tr><th>姓名</th><th>職稱</th><th>年資</th><th>近 3 年績效</th><th>潛力</th><th></th></tr></thead><tbody>
      ${mem.map(p=>`<tr class="click" data-go="emp-profile--${p.id}"><td><b>${p.name}</b></td><td>${p.title}</td><td>${p.years} 年</td><td>${p.perf.join('／')}</td><td>${potBadge(p.pot)}</td><td><a href="#emp-profile--${p.id}">查看畫像 →</a></td></tr>`).join('')}
    </tbody></table></div>`)}</div>`:''}`;
  },

  'dept-salary'(){
    const rows = DEPTS.map(d=>{
      const diff = Math.round((d.pay-CO_MEDIAN)/CO_MEDIAN*100);
      if(isMgr() && d.name!==MY_DEPT) return `<tr><td>${d.name}</td><td colspan="5"><span class="lock">無權限檢視其他部門薪資</span></td></tr>`;
      const st = diff<=-15?'<span class="badge b-danger">明顯偏低</span>':diff<=-8?'<span class="badge b-warn">偏低</span>':'<span class="badge b-ok">合理</span>';
      return `<tr><td><b>${d.name}</b></td><td>${d.n}</td><td>${isMgr()?payRange(d.pay):fmt(d.pay)+' 元'}</td>
        <td><span style="display:inline-block;height:8px;border-radius:4px;vertical-align:middle;width:${Math.min(90,Math.abs(diff)*4)}px;background:${diff<0?'var(--c-warn)':'var(--c-accent)'}"></span> ${diff>0?'+':''}${diff}%</td>
        <td>${d.turn>=12?`<span class="badge b-danger">${d.turn}%</span>`:d.turn+'%'}</td><td>${st}</td></tr>`;
    }).join('');
    const txt = isMgr()
      ? '產品研發部平均薪資高於公司中位數 17%，整體具競爭力；但部門內高績效的張家豪低於部門中位數 9%，建議於下次調薪優先檢視。'
      : '客戶服務部薪資低於公司中位數 23%，且離職率 15.8% 為全公司最高，兩者可能相關，建議優先檢視薪資結構；業務部偏低 11%，可搭配獎金制度一併評估。';
    return header('部門分析 › 部門薪資水平','部門薪資水平',`各部門平均月薪與公司中位數（${isMgr()?'約 58K':fmt(CO_MEDIAN)+' 元'}）比較，搭配離職率判斷是否需要調整。`,'部門薪資是否合理沒有數據')+
      card('各部門平均月薪（2027 年 Q2）',['pay','org'],`<div class="tbl-wrap"><table class="t"><thead><tr><th>部門</th><th>人數</th><th>平均月薪</th><th>與公司中位數比較</th><th>年度離職率</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${isMgr()?'<p class="lock" style="margin-top:10px">部門主管看到的薪資以區間顯示，個人薪資明細僅 HR 可檢視</p>':''}`)+
      `<div class="mt">${ai(txt,['pay','org'])}</div>`;
  },

  'dept-risk'(){
    const list = RISKS.filter(r=>!isMgr()||byId(r.id).dept===MY_DEPT);
    const txt = isMgr()
      ? '產品研發部有 1 位高風險人才（張家豪）：績效頂尖但薪資偏低、近半年幾乎沒有學習紀錄，建議本週安排面談並提出調薪或發展計畫。'
      : '目前有 2 位高風險人才，共同訊號是「績效好但薪資低於中位數」。建議 HR 與部門主管本月內完成關懷面談。';
    return header('部門分析 › 留才預警','留才預警','綜合績效、薪資、職務異動、訓練參與等訊號，標示需要關注的人才。','人才要離職了才知道')+
      card(`需要關注的人才（${list.length} 位）`,['perf','pay','org','train'],`<div class="tbl-wrap"><table class="t"><thead><tr><th>姓名</th><th>部門</th><th>風險</th><th>觀察到的訊號</th><th>訊號來源</th><th></th></tr></thead><tbody>
      ${list.map(r=>{const p=byId(r.id);return `<tr><td><a href="#emp-profile--${p.id}"><b>${p.name}</b></a></td><td>${p.dept}</td><td>${riskBadge(r.lv)}</td><td>${r.sig}</td><td style="font-size:12px;color:var(--c-text-sub)">${r.src.map(k=>APIS[k].prod).join('<br>')}</td><td><button class="btn btn-blue btn-sm" data-toast="已建立與 ${p.name} 的關懷面談提醒（示意）">安排面談</button></td></tr>`}).join('')}
      </tbody></table></div>`)+`<div class="mt">${ai(txt,['perf','pay','org','train'])}</div>`;

  'emp-list'(){
    const depts = ['全部',...visibleDepts().map(d=>d.name)];
    if(!depts.includes(S.listDept)) S.listDept='全部';
    const list = visiblePeople().filter(p=>(S.listDept==='全部'||p.dept===S.listDept)&&(!S.listQ||(p.name+p.title).includes(S.listQ)));
    return header('員工分析 › 員工畫像','員工畫像','搜尋員工，查看彙整自各資料 API 的360畫像。')+
    `<div class="filters"><input type="text" id="q" placeholder="搜尋姓名或職稱" value="${S.listQ}">
      部門：<select id="ld" ${isMgr()?'disabled':''}>${depts.map(x=>`<option ${x===S.listDept?'selected':''}>${x}</option>`).join('')}</select>
      ${isMgr()?'<span class="lock">部門主管只能檢視自己部門的員工</span>':''}</div>`+
    card(`員工清單（${list.length} 位，範例）`,['org','perf','assess'],list.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>姓名</th><th>部門</th><th>職稱</th><th>年資</th><th>近 3 年績效</th><th>潛力</th><th>最強項</th><th></th></tr></thead><tbody>
      ${list.map(p=>`<tr class="click" data-go="emp-profile--${p.id}"><td><b>${p.name}</b></td><td>${p.dept}</td><td>${p.title}</td><td>${p.years} 年</td><td>${p.perf.join('／')}</td><td>${potBadge(p.pot)}</td><td>${topN(p,1)[0][0]}</td><td><a href="#emp-profile--${p.id}">查看畫像 →</a></td></tr>`).join('')}
    </tbody></table></div>`:'<p style="color:var(--c-text-sub);padding:24px;text-align:center">查無符合條件的員工，請調整搜尋條件。</p>');
  },

  'emp-profile'(q){
    const p = byId(q.id) || visiblePeople()[0];
    if(isMgr() && p.dept!==MY_DEPT) return header('員工分析 › 員工畫像','員工畫像','')+`<div class="card locked"><div class="ic">🔒</div><b>無權限檢視其他部門員工</b>部門主管只能檢視產品研發部的員工畫像。<br><br><a class="btn btn-blue" href="#emp-list">回員工清單</a></div>`;
    const risk = RISKS.find(r=>r.id===p.id);
    return `<div class="crumb"><a href="#emp-list">員工分析 › 員工畫像</a> › ${p.name}</div>
    <div class="card"><div class="phead"><div class="avatar">${p.name[0]}</div>
      <div><div class="nm">${p.name} ${potBadge(p.pot)} ${risk?riskBadge(risk.lv):''}</div><div class="meta">${p.dept}｜${p.title}｜年資 ${p.years} 年</div>${srcs(['org'])}</div>
      <div class="acts"><button class="btn btn-line" data-addcmp="${p.id}">加入晉升比較</button><a class="btn btn-blue" href="#emp-idp--${p.id}">查看發展建議</a></div></div></div>
    <div class="grid g2 mt">
      ${card('績效歷程',['perf'],`<div class="perfrow">${['2024','2025','2026'].map((y,i)=>`<div><span>${y} 年</span><b>${p.perf[i]}</b><span>目標達成 ${gradeScore(p.perf[i])}%</span></div>`).join('')}</div>`)}
      ${card('薪資',['pay'],isMgr()
        ? `<div class="kpi"><div class="n" style="font-size:22px">${payRange(p.pay)}</div><p class="lock">個人薪資明細僅 HR 可檢視</p></div>`
        : `<div class="kpi"><div class="n">${fmt(p.pay)} 元</div><div class="s ${p.pay<DEPTS.find(d=>d.name===p.dept).pay?'down':'up'}">較部門平均 ${Math.round((p.pay-DEPTS.find(d=>d.name===p.dept).pay)/DEPTS.find(d=>d.name===p.dept).pay*100)}%</div></div>`)}
    </div>
    <div class="grid g2 mt">
      ${card('能力雷達（測評 PR）',['assess'],`<svg id="radar" viewBox="0 0 300 260" width="100%" style="max-width:340px;display:block;margin:0 auto"></svg>`)}
      ${card('人才黃金圈',['assess'],`<div class="circle"><div class="why"><b>Why｜工作動機</b>${p.motive}</div><div class="how"><b>How｜心理素質與風格</b>${p.style}</div><div class="what"><b>What｜外顯能力（前 3 強項）</b>${topN(p,3).map(x=>x[0]+' PR '+x[1]).join('、')}</div></div>`)}
    </div>
    <div class="grid g2 mt">
      ${card('學習紀錄',['train'],`<p>今年學習時數：<b>${p.hours} 小時</b>（公司平均 22 小時）</p>${p.courses.length?p.courses.map(c=>`<div class="course"><span>${c[0]}</span>${c[1]==='done'?'<span class="badge b-ok">已完成</span>':`<span class="badge b-warn">進行中 ${c[1]}</span>`}</div>`).join(''):'<p style="color:var(--c-text-sub);margin-top:8px">今年尚無修課紀錄</p>'}`)}
      ${ai(p.ai,['org','perf','assess','train','pay'])}
    </div>`;
  },

  'emp-compare'(){
    const poss = POSITIONS.filter(x=>!isMgr()||x.dept===MY_DEPT);
    if(!poss.find(x=>x.id===S.pos)) S.pos = poss[0].id;
    const pos = POSITIONS.find(x=>x.id===S.pos);
    const pool = PEOPLE.filter(p=>p.dept===pos.dept);
    S.picks = S.picks.filter(id=>pool.find(p=>p.id===id));
    if(!S.picks.length) S.picks = pool.slice(0,3).map(p=>p.id);
    const cands = S.picks.map(byId).map(p=>({p,fit:fitScore(p,S.pos)})).sort((a,b)=>b.fit-a.fit);
    const best = cands[0];
    const txt = cands.length<2 ? '請至少選擇 2 位候選人進行比較。'
      : `「${pos.name}」需要帶人與跨部門協調，領導能力與溝通協作權重最高。${best.p.name}職務適配度最高（${best.fit}%），${topN(best.p,1)[0][0]}是最大優勢；${cands.slice(1).map(c=>`${c.p.name}的強項是${topN(c.p,1)[0][0]}，但${lowN(c.p,1)[0][0]}較弱`).join('；')}。建議由${best.p.name}優先接任，並為其他候選人安排對應的發展計畫。`;
    return header('員工分析 › 晉升人選比較','晉升人選比較','依職務需求，把候選人的適配度、績效、動機與強弱項並排比較。','用人、升遷靠主管主觀判斷')+
    `<div class="card"><div class="filters" style="margin:0">職缺：<select id="posSel">${poss.map(x=>`<option value="${x.id}" ${x.id===S.pos?'selected':''}>${x.name}（${x.dept}）</option>`).join('')}</select>
      <span style="color:var(--c-text-sub)">選擇候選人（2–4 位）：</span><div class="picks">${pool.map(p=>`<button class="pick ${S.picks.includes(p.id)?'on':''}" data-pick="${p.id}">${p.name}</button>`).join('')}</div></div></div>
    <div class="card mt"><div class="card-h"><h3>候選人比較</h3>${srcs(['perf','assess','org'])}</div>
      <div class="cmp" style="grid-template-columns:repeat(${Math.max(cands.length,1)},1fr)">
      ${cands.map((c,i)=>`<div class="ccard ${i===0&&cands.length>1?'best':''}">${i===0&&cands.length>1?'<span class="badge b-ok" style="align-self:flex-start">最適合</span>':''}
        <div class="nm"><a href="#emp-profile--${c.p.id}">${c.p.name}</a></div><div style="color:var(--c-text-sub)">${c.p.title}・年資 ${c.p.years} 年</div>
        <div><span class="fit">${c.fit}%</span> <span style="color:var(--c-text-sub)">職務適配度</span></div>
        <div class="row"><span>近 3 年績效</span><span>${c.p.perf.join('／')}</span></div>
        <div class="row"><span>領導能力</span><span>PR ${c.p.radar[1]}</span></div>
        <div class="row"><span>溝通協作</span><span>PR ${c.p.radar[2]}</span></div>
        <div class="row"><span>工作動機</span><span>${c.p.motive.split('，')[0]}</span></div>
        <div class="row"><span>最強項</span><span>${topN(c.p,1)[0][0]}</span></div>
        <div class="row"><span>需注意</span><span style="color:var(--c-warn)">${lowN(c.p,1)[0][0]} PR ${lowN(c.p,1)[0][1]}</span></div></div>`).join('')}
      </div></div>
    <div class="mt">${ai(txt,['perf','assess','org'])}</div>`;
  },

  'emp-idp'(q){
    if(q.id) S.idp=q.id;
    const vis = visiblePeople();
    if(!vis.find(p=>p.id===S.idp)) S.idp = vis[0].id;
    const p = byId(S.idp);
    const weak = lowN(p,3);
    return header('員工分析 › 個人發展建議','個人發展建議（IDP）','依測評弱項推薦企業學習平台的課程，並追蹤學習進度。','培訓一體適用、成效不明')+
    `<div class="filters">員工：<select id="idpSel">${vis.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name}（${x.dept}）</option>`).join('')}</select><a href="#emp-profile--${p.id}">查看 ${p.name} 的完整畫像 →</a></div>
    <div class="grid g2">
      ${card('待加強的能力',['assess'],`<div class="bars">${weak.map(w=>bar(w[0],w[1],'PR '+w[1],'warn')).join('')}</div>`)}

        `<p style="font-size:12px;color:var(--c-text-sub);margin-top:10px">課程與進度來自企業學習平台，<a href="${APIS.train.url}" target="_blank" rel="noopener">前往查看完整學習紀錄 ↗</a></p>`)}
    </div>
    <div class="mt">${ai(`${p.name}的強項是${topN(p,2).map(x=>x[0]).join('與')}，${weak.map(x=>x[0]).slice(0,2).join('、')}相對較弱。建議優先完成「${COURSE[weak[0][0]]}」，並安排需要${weak[0][0]}的實際任務歷練，3 個月後再以測評追蹤成效。`,['assess','train'])}</div>`;
  }
};

/* ===================== 路由 ===================== */
function parse(){
  const h = location.hash.replace('#','') || 'home';
  const [page, id] = h.split('--');
  const q = id ? {id} : {};
  return {page: PAGES[page]?page:'home', q};
}
function render(){
  const {page,q} = parse();
  renderSide(page);
  const m = $('#main');
  m.innerHTML = `<div class="fade">${PAGES[page](q)}</div>`;
  if($('#radar')) drawRadar(byId(q.id)||visiblePeople()[0]);
  setTimeout(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'),50);
  bind();
  const key = location.hash;
  if(key!==render.last){ window.scrollTo(0,0); render.last=key; }
}
function bind(){
  const ds=$('#deptSel'); if(ds) ds.onchange=()=>{S.dept=ds.value;render()};
  const ld=$('#ld'); if(ld) ld.onchange=()=>{S.listDept=ld.value;render()};
  const qi=$('#q'); if(qi){
    const go=()=>{S.listQ=qi.value.trim();const pos=qi.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
    qi.addEventListener('input',e=>{if(!e.isComposing)go()});
    qi.addEventListener('compositionend',go);
  }
  const ps=$('#posSel'); if(ps) ps.onchange=()=>{S.pos=ps.value;S.picks=[];render()};
  const is=$('#idpSel'); if(is) is.onchange=()=>{S.idp=is.value; if(location.hash!=='#emp-idp') location.hash='emp-idp'; else render();};
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.pick;
    if(S.picks.includes(id)){ if(S.picks.length<=2){toast('至少需要 2 位候選人');return} S.picks=S.picks.filter(x=>x!==id);}
    else{ if(S.picks.length>=4){toast('最多比較 4 位候選人');return} S.picks.push(id);}
    render();
  });
}
function drawRadar(p){
  const cx=150,cy=130,R=95,n=6;let s='';
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  [.25,.5,.75,1].forEach(k=>{s+=`<polygon points="${DIMS.map((_,i)=>pt(i,R*k).join(',')).join(' ')}" fill="none" stroke="#dddddd"/>`});
  DIMS.forEach((l,i)=>{const e=pt(i,R),t=pt(i,R+20);s+=`<line x1="${cx}" y1="${cy}" x2="${e[0]}" y2="${e[1]}" stroke="#eeeeee"/><text x="${t[0]}" y="${t[1]+4}" font-size="12" text-anchor="middle" fill="#7e7e7e">${l}</text>`});
  s+=`<polygon points="${p.radar.map((v,i)=>pt(i,R*v/100).join(',')).join(' ')}" fill="rgba(0,175,184,.25)" stroke="#00afb8" stroke-width="2"/>`;
  p.radar.forEach((v,i)=>{const q=pt(i,R*v/100);s+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="#028b95"/>`});
  $('#radar').innerHTML=s;
}

/* 全域事件 */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toast]'); if(t){toast(t.dataset.toast);return}
  const a=e.target.closest('[data-addcmp]'); if(a){
    const p=byId(a.dataset.addcmp); const pos=POSITIONS.find(x=>x.dept===p.dept&&(!isMgr()||x.dept===MY_DEPT));
    if(!pos){toast(`${p.dept}目前沒有開放中的晉升職缺（示意）`);return}
    S.pos=pos.id; if(!S.picks.includes(p.id)) S.picks=[...S.picks.filter(id=>byId(id).dept===p.dept).slice(0,3),p.id];
    location.hash='emp-compare'; return;
  }
  const dl=e.target.closest('a[data-dept]'); if(dl) S.dept=dl.dataset.dept;
  if(e.target.closest('a,button,select,input')) return;
  const r=e.target.closest('tr[data-go]'); if(r){ if(r.dataset.dept) S.dept=r.dataset.dept; location.hash=r.dataset.go; }
});
const whoMenu=$('#whoMenu'), whoBtn=$('#whoBtn');
whoBtn.onclick=e=>{e.stopPropagation();whoMenu.hidden=!whoMenu.hidden;whoBtn.setAttribute('aria-expanded',String(!whoMenu.hidden))};
document.addEventListener('click',e=>{if(!e.target.closest('.who')){whoMenu.hidden=true;whoBtn.setAttribute('aria-expanded','false')}});
whoMenu.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
  S.role=b.dataset.role; whoMenu.hidden=true;
  whoMenu.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on',x===b));
  $('#av').textContent=isMgr()?'陳':'王'; $('#whoName').textContent=isMgr()?'陳協理':'王經理';
  toast(isMgr()?'目前以陳協理（產品研發部主管）的帳號檢視':'目前以王經理（人資部）的帳號檢視');
  render();
});
window.addEventListener('hashchange',render);
document.querySelector('a.why').addEventListener('click',e=>{e.preventDefault();location.href=new URL('./',location.href).href;});
render();
</script>
