:root{

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--c-text);background:var(--c-bg);line-height:1.6;font-size:15px}
a{color:var(--c-primary)}
button,select,input{font-family:inherit;font-size:14px}
button{cursor:pointer}

/* 品牌列 */

.logo{display:flex;align-items:center;gap:14px;white-space:nowrap;text-decoration:none}
.logo .mark{display:block;flex:none}
.logo .prod{font-weight:700;font-size:22px;line-height:1;color:#6f6f6f;letter-spacing:.5px}
.co{font-size:17px;color:var(--c-heading);white-space:nowrap;padding-left:14px;border-left:1px solid #a9a9a9;line-height:1.2}
.sp{flex:1}
.why{color:var(--c-accent);font-size:13px;text-decoration:none;white-space:nowrap}

.who{position:relative;white-space:nowrap}
.who-btn{display:flex;align-items:center;gap:8px;border:0;background:none;font-size:14px;color:var(--c-text);padding:4px 6px;border-radius:4px}

.who-menu{position:absolute;right:0;top:44px;z-index:50;min-width:220px;background:#fff;border:1px solid var(--c-border);border-radius:4px;box-shadow:0 2px 8px 0 rgba(41,41,41,.15);padding:6px}

.who-menu button:hover{background:var(--c-primary-light)}
.who-menu button.on b{color:var(--c-primary)}
.who-menu button span{font-size:12px;color:var(--c-text-sub)}

/* 模組頁籤列（滑過展開子選單） */

.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px}
.tab-item{position:relative}

.tab-item:hover>a,.tab-item:focus-within>a{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.tab-item>a.on{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.tab-item>a small{font-size:12px;color:var(--c-text-sub);margin-left:4px}
.drop{display:none;position:absolute;left:0;top:100%;z-index:45;min-width:180px;background:#fff;border:1px solid var(--c-border);border-radius:4px;box-shadow:0 2px 8px 0 rgba(41,41,41,.15);padding:6px}

main{padding:24px 28px 48px;max-width:1440px;margin:0 auto}

.sub{font-size:13px;color:var(--c-text-sub)}

.tip{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid #a9a9a9;color:#7e7e7e;font-size:10px;font-weight:700;line-height:1;cursor:help}
.tip:hover,.tip:focus{border-color:var(--c-primary);color:var(--c-primary);outline:none}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);width:230px;background:#292929;color:#fff;font-size:12px;font-weight:400;line-height:1.5;padding:8px 10px;border-radius:4px;z-index:60;text-align:left}

.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:10px;font-size:14px}
.track{position:relative;height:10px;background:#eeeeee;border-radius:5px;overflow:visible}
.fill{position:absolute;left:0;top:0;height:100%;background:var(--c-primary);border-radius:5px;width:0;transition:width .8s}
.fill.warn{background:var(--c-warn)}
.target{position:absolute;top:-4px;width:2px;height:18px;background:var(--c-heading)}
.bar .v{text-align:right;color:var(--c-text-sub);font-variant-numeric:tabular-nums}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;background:#f3f3f3;color:var(--c-text-sub);font-weight:700;padding:10px;border-bottom:1px solid var(--c-border);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid #eeeeee;vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--c-primary-light)}
.tbl{overflow-x:auto}

.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.b-ok{background:var(--c-ok-light);color:var(--c-ok)}.b-warn{background:var(--c-warn-light);color:var(--c-warn)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:4px;padding:8px 14px;font-weight:700;text-decoration:none;font-size:14px;white-space:nowrap}

.plan h4{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between}
.plan h4 span{font-size:12px;color:var(--c-text-sub);font-weight:400}
.plan li{font-size:14px;margin:6px 0 0 18px}

.ccard{border:1px solid var(--c-border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;background:#fff}
.ccard.best{border:2px solid var(--c-primary)}

.ccard .row span:first-child{color:var(--c-text-sub)}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pick{border:1px solid var(--c-border);border-radius:999px;padding:4px 12px;background:#fff;font-size:13px}
.pick.on{background:var(--c-primary);border-color:var(--c-primary);color:#fff}

.locked{text-align:center;padding:56px 20px;color:var(--c-text-sub)}
.locked b{display:block;font-size:18px;color:var(--c-text);margin:8px 0}
.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;pointer-events:none}
.toast{background:#292929;color:#fff;padding:10px 18px;border-radius:4px;font-size:14px;opacity:0;transition:.3s}
.toast.show{opacity:1}
.fade{animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{font-size:12px;color:var(--c-text-sub);text-align:center;padding:16px}

@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.g2,.g3{grid-template-columns:1fr}.co,.why{display:none}main{padding:16px}.appbar{padding:0 12px;gap:10px}.tabs{gap:4px}}

</style>

const gaps=(p,j)=>p.radar.map((v,i)=>({d:DIMS[i],v,t:j.target[i],g:j.target[i]-v})).filter(x=>x.g>0).sort((a,b)=>b.g-a.g);
const range=n=>`約 ${Math.floor(n/1000)-3}K–${Math.floor(n/1000)+3}K`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
const src=keys=>`<div class="card-src">來源：${keys.map(k=>`<a href="${SRC[k].url}" target="_blank" rel="noopener" title="前往${SRC[k].prod}查看完整資料">${SRC[k].prod}</a>`).join('、')}</div>`;
const card=(title,keys,body,extra='')=>`<div class="card"><div class="card-h"><h3>${title}</h3>${extra}</div>${body}${keys&&keys.length?src(keys):''}</div>`;
const tip=t=>`<span class="tip" tabindex="0" role="img" aria-label="計算方式：${t}" data-tip="${t}">!</span>`;
const kpi=(l,n,t,sub='')=>`<div class="card kpi"><div class="l">${l}${t?tip(t):''}</div><div class="n">${n}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;

const fitCell=f=>`<div style="display:flex;align-items:center;gap:8px"><span class="fitnum" style="font-size:16px">${f}%</span><span class="fitbar"><i style="width:${f}%"></i></span></div>`;
const riskB=lv=>`<span class="badge ${lv==='高'?'b-danger':lv==='中'?'b-warn':'b-ok'}">${lv}風險</span>`;
function gapBars(p,j){return `<div class="bars">${DIMS.map((d,i)=>{const v=p.radar[i],t=j.target[i];return `<div class="bar"><span>${d}</span><span class="track"><span class="fill ${v<t?'warn':''}" data-w="${v}"></span><span class="target" style="left:${t}%"></span></span><span class="v">${v}／${t}</span></div>`}).join('')}</div><p class="sub" style="margin-top:8px">長條＝員工目前 PR，黑線＝職缺要求；橘色代表未達要求</p>`}

      ${card('學習與歷練建議',['train','assess'],g.length?`<div class="plan"><h4>工作歷練 <span>約 70%</span></h4><ul>${g.map(x=>`<li>${TASK[x.d]}</li>`).join('')}</ul></div>
        <div class="plan mt"><h4>指導與回饋 <span>約 20%</span></h4><ul>${g.map(x=>`<li>${MENTOR[x.d]}</li>`).join('')}</ul></div>
        <div class="plan mt"><h4>課程 <span>約 10%</span></h4><ul>${g.map(x=>`<li>${COURSE[x.d]} <button class="btn btn-line btn-sm" data-toast="已將「${COURSE[x.d]}」指派給 ${p.name}（示意）">指派</button></li>`).join('')}</ul></div>
        <p class="sub" style="margin-top:10px">比例參考 70-20-10 學習法則：能力成長多來自工作歷練。</p>`:'<p>已達到目標職缺的能力要求，可直接列入人選。</p>')}
    </div>
    <div class="mt">${ai(g.length?`${p.name}距離「${j.name}」最大的落差是${g.map(x=>x.d).join('與')}。建議先安排「${TASK[g[0].d]}」的實際歷練，搭配「${COURSE[g[0].d]}」課程，約 6 個月後重新比對適配度。`:`${p.name}已符合「${j.name}」的能力要求，可與主管討論轉任時程。`)}</div>`;
  },

  plan(){
    const ppl=visP(), LOW=70;
    const rows=DIMS.map((d,i)=>({d,who:ppl.filter(p=>p.radar[i]<LOW)})).filter(r=>r.who.length).sort((a,b)=>b.who.length-a.who.length);
    const avgH=Math.round(ppl.reduce((s,p)=>s+p.hours,0)/ppl.length);
    const lowH=ppl.filter(p=>p.hours<10);
    return head('育才 › 培訓規劃','培訓規劃','彙整'+(isMgr()?'部門':'全公司')+'人才的能力落差，找出最多人需要加強的能力，安排對應課程與對象。')+
    `<div class="grid g4">${kpi('檢視人數',ppl.length+' 人')}${kpi('需加強的能力面向',rows.length+' 項','PR 低於 '+LOW+' 視為需加強')}${kpi('平均學習時數',avgH+' 小時','','今年至今')}${kpi('學習時數偏低',lowH.length+' 人','今年學習未滿 10 小時')}</div>`+
    `<div class="mt">`+card('建議培訓項目（依需求人數排序）',['assess','train'],`<div class="tbl"><table class="t"><thead><tr><th>能力面向</th><th>需加強人數</th><th>建議課程</th><th>建議對象</th><th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td><b>${r.d}</b></td><td>${r.who.length} 人</td><td>${COURSE[r.d]}</td><td>${r.who.map(p=>p.name).join('、')}</td><td><button class="btn btn-blue btn-sm" data-toast="已建立「${COURSE[r.d]}」培訓計畫，指派給 ${r.who.length} 人（示意）">建立培訓計畫</button></td></tr>`).join('')}
    </tbody></table></div><p class="sub" style="margin-top:8px">課程可在企業學習平台開班或指派線上課；每位對象的完整落差請看發展路徑。</p>`)+`</div>`+
    `<div class="mt">${ai(rows.length?`最多人需要加強的是「${rows[0].d}」（${rows[0].who.length} 人），建議優先開設「${COURSE[rows[0].d]}」。另有 ${lowH.length} 位學習時數偏低，可搭配主管一對一討論學習計畫。`:'目前人才能力皆達標準。')}</div>`;
  },

  risk(){
    const ppl=visP(); const list=RISKS.filter(r=>ppl.some(p=>p.id===r.id));
    return head('留才 › 離職預測','離職預測','綜合績效、薪資、職務異動與學習參與等訊號，提早留意可能想離開的人才。')+
      card(`需要關注的人才（${list.length} 位）`,['perf','pay','org','train'],`<div class="tbl"><table class="t"><thead><tr><th>姓名</th><th>部門</th><th>風險</th><th>觀察到的訊號</th><th></th></tr></thead><tbody>
      ${list.map(r=>{const p=byId(r.id);return `<tr><td><b>${p.name}</b></td><td>${p.dept}</td><td>${riskB(r.lv)}</td><td>${r.sig}</td><td><button class="btn btn-blue btn-sm" data-toast="已建立與 ${p.name} 的關懷面談提醒（示意）">安排面談</button> <a class="btn btn-line btn-sm" href="#path--${p.id}">發展路徑</a></td></tr>`}).join('')}
      </tbody></table></div>`)+`<div class="mt">${ai('高風險人才的共同訊號是「績效好但薪資偏低」。除了調薪，也可以提供明確的發展路徑，讓他們看見內部的下一步。')}</div>`;
  },

  salary(){
    const rows=DEPTS.map(d=>{const diff=Math.round((d.pay-CO_MEDIAN)/CO_MEDIAN*100);
      if(isMgr()&&d.name!==MY_DEPT) return `<tr><td>${d.name}</td><td colspan="4"><span class="lock">無權限檢視其他部門薪資</span></td></tr>`;
      return `<tr><td><b>${d.name}</b></td><td>${d.n}</td><td>${isMgr()?range(d.pay):fmt(d.pay)+' 元'}</td><td>${diff>0?'+':''}${diff}%</td><td>${diff<=-15?'<span class="badge b-danger">明顯偏低</span>':diff<=-8?'<span class="badge b-warn">偏低</span>':'<span class="badge b-ok">合理</span>'}</td></tr>`}).join('');
    const under=visP().filter(p=>p.pay<DEPTS.find(d=>d.name===p.dept).pay*0.95&&p.perf[2].startsWith('A'));
    return head('留才 › 薪資合理性','薪資合理性','各部門與高績效員工的薪資，是否與表現相稱。')+
    `<div class="grid g2">${card('各部門平均月薪 vs 公司中位數',['pay','org'],`<div class="tbl"><table class="t"><thead><tr><th>部門</th><th>人數</th><th>平均月薪</th><th>與中位數比較</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table></div>`)}
    ${card('高績效但薪資偏低的員工',['pay','perf'],under.length?under.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--c-border);font-size:14px"><span><b>${p.name}</b>｜${p.dept}｜近一年 ${p.perf[2]}</span><span>${isMgr()?range(p.pay):fmt(p.pay)+' 元'}</span></div>`).join('')+'<p class="sub" style="margin-top:8px">條件：最近一次績效 A 以上，且月薪低於部門平均 5% 以上</p>':'<p class="sub">目前沒有</p>')}</div>`;
  },

  /* ===== 員工本人 ===== */
  me(a){
    if(a&&job(a)) S.meJ=a;
    const p=byId(ME), j=job(S.meJ), f=fit(p,j), g=gaps(p,j);
    const strong=DIMS.map((d,i)=>[d,p.radar[i]]).sort((x,y)=>y[1]-x[1]).slice(0,2).map(x=>x[0]);
    const g2=g.slice(0,2);
    const addBtn=t=>S.myList.includes(t)?`<span class="badge b-ok">已加入</span>`:`<button class="btn btn-line btn-sm" data-add="${t}">加入學習清單</button>`;
    return `<div class="hello">${p.name}您好，這是您的人才畫像</div>
    <p class="sub" style="font-size:14px;margin:4px 0 16px">看見自己的強項，並了解往目標職缺還需要準備什麼。這份資料只有您本人、您的主管與人資看得到。</p>
    <div class="grid g2">
      ${card('我的能力（PR）',['assess'],`<div class="bars">${DIMS.map((d,i)=>`<div class="bar"><span>${d}</span><span class="track"><span class="fill" data-w="${p.radar[i]}"></span></span><span class="v">PR ${p.radar[i]}</span></div>`).join('')}</div><p class="sub" style="margin-top:8px">您的強項：${strong.join('、')}</p>`)}
      ${card('我的樣貌',['assess','org','perf','train'],`<div class="cond"><div><b>目前職位</b><span>${p.dept}｜${p.title}｜年資 ${p.years} 年</span></div><div><b>工作動機</b><span>${p.motive}</span></div><div><b>近 3 年績效</b><span>${p.perf.join('／')}</span></div><div><b>今年學習</b><span>${p.hours} 小時，已完成「同理溝通與回饋技巧」</span></div></div>`)}
    </div>
    <div class="filters mt">我的目標職缺：<select id="meJ">${JOBS.map(x=>`<option value="${x.id}" ${x.id===j.id?'selected':''}>${x.name}（${x.dept}）</option>`).join('')}</select><a href="#explore">看其他職缺</a></div>
    <div class="card"><div class="route"><div class="node"><span class="sub">目前</span><b>${p.title}</b><span class="sub">${p.dept}</span></div><span class="arrow">→</span><div class="node"><span class="sub">目標</span><b>${j.name}</b><span class="sub">${j.dept}</span></div><div style="margin-left:auto;text-align:right"><span class="sub" style="display:inline-flex;align-items:center;gap:4px">目前適配度${tip('各能力面向「我的 PR ÷ 職缺要求」的平均，超過要求以 100% 計')}</span><div class="fitnum">${f}%</div></div></div></div>
    <div class="grid g2 mt">
      ${card('還差什麼',['assess'],gapBars(p,j))}
      ${card('我可以怎麼準備',['train','assess'],g2.length?`<div class="plan"><h4>爭取的歷練</h4><ul>${g2.map(x=>`<li>${TASK[x.d]}</li>`).join('')}</ul></div>
        <div class="plan mt"><h4>建議課程</h4><ul>${g2.map(x=>`<li>${COURSE[x.d]} ${addBtn(COURSE[x.d])}</li>`).join('')}</ul></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn btn-blue btn-sm" data-toast="已通知主管您對「${j.name}」有興趣，並附上目前的適配度與準備計畫（示意）">讓主管知道我的意願</button></div>`:'<p>您已達到這個職缺的能力要求，可以和主管討論轉任時程。</p>')}
    </div>
    <div class="mt">${ai(g2.length?`您的${strong[0]}是明顯強項。往「${j.name}」發展，最需要補強的是${g2.map(x=>x.d).join('與')}，建議先爭取「${TASK[g2[0].d]}」的機會，並完成「${COURSE[g2[0].d]}」。`:`您已符合「${j.name}」的能力要求。`)}</div>`;
  },

  explore(){
    const p=byId(ME);
    const list=JOBS.map(j=>({j,f:fit(p,j),g:gaps(p,j)})).sort((a,b)=>b.f-a.f);
    return head('探索職缺','探索職缺','看看公司內部的關鍵職缺，以及您目前的適配度。')+
    card(`內部關鍵職缺（${list.length} 個）`,['assess','org'],`<div class="tbl"><table class="t"><thead><tr><th>職缺</th><th>部門</th><th>我的適配度</th><th>主要落差</th><th></th></tr></thead><tbody>
      ${list.map(x=>`<tr><td><b>${x.j.name}</b></td><td>${x.j.dept}</td><td>${fitCell(x.f)}</td><td>${x.g.length?x.g.slice(0,2).map(g=>`<span class="chip">${g.d} −${g.g}</span>`).join(''):'<span class="badge b-ok">已達要求</span>'}</td><td><a class="btn btn-line btn-sm" href="#me--${x.j.id}">設為目標</a></td></tr>`).join('')}
    </tbody></table></div><p class="sub" style="margin-top:8px">適配度只看能力面向，實際任用仍需主管與人資評估。</p>`);
  }
};
function setRole(r,silent){
  S.role=r; const R=ROLES[r];
  document.querySelectorAll('#whoMenu [data-role]').forEach(x=>x.classList.toggle('on',x.dataset.role===r));
  $('#av').textContent=R.av; $('#whoName').textContent=R.nm;
  if(!silent) toast(R.msg);
}

/* ===== 路由 ===== */
function render(){
  const h=location.hash.replace('#','')||'home';
  const [page,a,b]=h.split('--');
  if(page==='home'&&ROLES[a]&&a!==S.role) setRole(a,true);
  if(EMP_PAGES.includes(page)&&!isEmp()) setRole('emp',true);
  let fn=PAGES[page]?page:'home';
  if(isEmp()&&!EMP_PAGES.includes(fn)) fn='me';
  if(!isEmp()&&EMP_PAGES.includes(fn)) fn='home';
  renderNav(fn);
  $('#main').innerHTML=`<div class="fade">${PAGES[fn](a,b)}</div>`;
  setTimeout(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'),50);
  bind();
  if(location.hash!==render.last){window.scrollTo(0,0);render.last=location.hash;}
}
function bind(){
  const js=$('#jobSel'); if(js) js.onchange=()=>{S.job=js.value;render()};
  const mj=$('#meJ'); if(mj) mj.onchange=()=>{location.hash='me--'+mj.value};
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{S.myList.push(b.dataset.add);toast(`已將「${b.dataset.add}」加入學習清單（示意）`);render()});
  const ps=$('#promoSel'); if(ps) ps.onchange=()=>{S.job=ps.value;S.picks=[];render()};
  const pp=$('#pathP'), pj=$('#pathJ');
  if(pp) pp.onchange=()=>{S.pathP=pp.value; location.hash='path--'+S.pathP+'--'+S.pathJ};
  if(pj) pj.onchange=()=>{S.pathJ=pj.value; location.hash='path--'+S.pathP+'--'+S.pathJ};
  document.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.pick;
    if(S.picks.includes(id)){if(S.picks.length<=2){toast('至少需要 2 位候選人');return}S.picks=S.picks.filter(x=>x!==id)}
    else{if(S.picks.length>=4){toast('最多比較 4 位候選人');return}S.picks.push(id)} render();});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toast]'); if(t){toast(t.dataset.toast);return}
  const jl=e.target.closest('a[data-job]'); if(jl) S.job=jl.dataset.job;
  if(e.target.closest('a,button,select,input')) return;
  const r=e.target.closest('tr[data-go]'); if(r) location.hash=r.dataset.go;
});
const whoMenu=$('#whoMenu'), whoBtn=$('#whoBtn');
whoBtn.onclick=e=>{e.stopPropagation();whoMenu.hidden=!whoMenu.hidden;whoBtn.setAttribute('aria-expanded',String(!whoMenu.hidden))};
document.addEventListener('click',e=>{if(!e.target.closest('.who')){whoMenu.hidden=true;whoBtn.setAttribute('aria-expanded','false')}});
whoMenu.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
  whoMenu.hidden=true; setRole(b.dataset.role);
  const target=isEmp()?'#me':'#home';
  if(location.hash===target) render(); else location.hash=target;
});
document.querySelector('a.why').addEventListener('click',e=>{e.preventDefault();location.href=new URL('./',location.href).href;});
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
