<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人才360畫像（C 版：市場比較）｜Talent One</title>
<style>
/* ===== 配色：104 HA 大B 設計公版（react-ha-v2 palette / colors / typography） ===== */
:root{
  --c-primary:#00afb8; --c-primary-dark:#014a50; --c-primary-light:#e6f9fa;
  --c-heading:#292929; --c-accent:#1654b9; --c-accent-light:#dbe8ff;
  --c-warn:#ff7800; --c-warn-light:#ffeedf; --c-danger:#ea475b; --c-danger-light:#ffe9ec;
  --c-ok:#509e1f; --c-ok-light:#e9f6dc;
  --c-bg:#f3f3f3; --c-surface:#ffffff; --c-border:#dddddd; --c-text:#292929; --c-text-sub:#7e7e7e;
  --radius:8px; --shadow:0 2px 4px 0 rgba(41,41,41,.1);
  --font:Arial,"PingFang TC","Microsoft JhengHei",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--c-text);background:var(--c-bg);line-height:1.6;font-size:15px}
a{color:var(--c-primary)}
button,select,input{font-family:inherit;font-size:14px}
button{cursor:pointer}

/* 品牌列 */
.appbar{position:sticky;top:0;z-index:40;height:60px;background:#fff;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid #eeeeee}
.logo{display:flex;align-items:center;gap:14px;white-space:nowrap;text-decoration:none}
.logo .mark{display:block;flex:none}
.logo .mk{height:30px;width:58px;overflow:hidden}
.logo .mk img{display:block;height:42px;width:auto;max-width:none;margin-top:-6px}
.logo .prod{font-weight:700;font-size:22px;line-height:1;color:#6f6f6f;letter-spacing:.5px}
.co{font-size:17px;color:var(--c-heading);white-space:nowrap;padding-left:14px;border-left:1px solid #a9a9a9;line-height:1.2}
.sp{flex:1}
.why{color:var(--c-accent);font-size:13px;text-decoration:none;white-space:nowrap}
.why:hover{text-decoration:underline}
.who{position:relative;white-space:nowrap}
.who-btn{display:flex;align-items:center;gap:8px;border:0;background:none;font-size:14px;color:var(--c-text);padding:4px 6px;border-radius:4px}
.who-btn:hover{background:var(--c-bg)}
.who-btn .caret{font-size:11px;color:var(--c-text-sub)}
.av{width:30px;height:30px;border-radius:50%;background:var(--c-primary-light);color:var(--c-primary);display:flex;align-items:center;justify-content:center;font-weight:900}
.who-menu{position:absolute;right:0;top:44px;z-index:50;min-width:220px;background:#fff;border:1px solid var(--c-border);border-radius:4px;box-shadow:0 2px 8px 0 rgba(41,41,41,.15);padding:6px}
.who-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;background:none;padding:8px 10px;border-radius:4px;text-align:left;font-size:14px;color:var(--c-text)}
.who-menu button:hover{background:var(--c-primary-light)}
.who-menu button.on b{color:var(--c-primary)}
.who-menu button span{font-size:12px;color:var(--c-text-sub)}
.who-menu .sec{font-size:12px;color:var(--c-text-sub);padding:8px 10px 4px;border-top:1px solid var(--c-border);margin-top:4px}
.who-menu .sec:first-child{border-top:0;margin-top:0}

/* 頁籤列 */
.side{position:sticky;top:60px;z-index:30;background:#fff;border-bottom:1px solid var(--c-border);box-shadow:0 2px 4px 0 rgba(41,41,41,.06)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px}
.tab-item{position:relative}
.tab-item>a{display:block;padding:12px 16px 9px;font-size:17px;color:var(--c-text);text-decoration:none;border-bottom:4px solid transparent;white-space:nowrap}
.tab-item:hover>a,.tab-item:focus-within>a{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.tab-item>a.on{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.tab-item>a small{font-size:12px;color:var(--c-text-sub);margin-left:4px}
.tab-item>a .cnt{display:inline-block;font-size:11px;font-weight:700;background:var(--c-danger);color:#fff;border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px;line-height:16px}
.drop{display:none;position:absolute;left:0;top:100%;z-index:45;min-width:180px;background:#fff;border:1px solid var(--c-border);border-radius:4px;box-shadow:0 2px 8px 0 rgba(41,41,41,.15);padding:6px}
.tab-item:hover .drop,.tab-item:focus-within .drop{display:block}
.drop a{display:block;padding:8px 12px;border-radius:4px;font-size:14px;color:var(--c-text);text-decoration:none;white-space:nowrap}
.drop a:hover{background:var(--c-bg);color:var(--c-primary)}
.drop a.on{background:var(--c-primary-light);color:var(--c-primary);font-weight:700}
.drop a.lk::after{content:" 🔒";font-size:11px}

main{padding:24px 28px 48px;max-width:1440px;margin:0 auto}
.crumb{font-size:13px;color:var(--c-text-sub);margin-bottom:4px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:26px;color:var(--c-heading);font-weight:900;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.b-brand{background:var(--c-primary-light);color:var(--c-primary-dark)}
.scope{vertical-align:middle}
.ph p{color:var(--c-text-sub);font-size:14px}
.hello{font-size:22px;font-weight:900;color:var(--c-heading)}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{font-size:16px;color:var(--c-heading)}
.card-h .hint{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.card-src{margin-top:12px;padding-top:8px;border-top:1px solid #eeeeee;font-size:12px;color:var(--c-text-sub)}
.card-src a{color:var(--c-text-sub);text-decoration:none;border-bottom:1px dotted var(--c-text-sub)}
.card-src a:hover{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.mt{margin-top:16px}
.sub{font-size:13px;color:var(--c-text-sub)}
.kpi .l{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--c-text-sub)}
.kpi .n{font-size:26px;font-weight:900;color:var(--c-heading);line-height:1.3}
.kpi .n.r{color:var(--c-danger)}

.tip{position:relative;top:-1px;vertical-align:middle;flex:none;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid #a9a9a9;color:#7e7e7e;font-size:10px;font-weight:700;line-height:1;cursor:help}
.tip:hover,.tip:focus{border-color:var(--c-primary);color:var(--c-primary);outline:none}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);width:230px;background:#292929;color:#fff;font-size:12px;font-weight:400;line-height:1.5;padding:8px 10px;border-radius:4px;z-index:60;text-align:left;white-space:normal;box-shadow:0 2px 8px 0 rgba(41,41,41,.15)}
.ph p .tip,.card-h h3 .tip,.sub .tip,.nine-def .tip{margin-left:4px}
.t th .tip:hover::after,.t th .tip:focus::after{bottom:auto;top:calc(100% + 6px)}
.card-h .hint .tip:hover::after,.card-h .hint .tip:focus::after{left:auto;right:-6px;transform:none}

.bars{display:flex;flex-direction:column;gap:10px}
.track{position:relative;height:10px;background:#eeeeee;border-radius:5px}
.fill{position:absolute;left:0;top:0;height:100%;background:var(--c-primary);border-radius:5px;width:0;transition:width .8s}
.fill.warn{background:var(--c-warn)}
.fill.req{background:#c9ced6}
.lockline{font-size:13px;color:var(--c-text-sub);margin-top:6px}
.lockline a{margin-left:6px;color:var(--c-primary);font-weight:700;text-decoration:none}
.gh{font-size:13px;font-weight:700;color:var(--c-heading);margin-bottom:8px;padding-left:8px;border-left:3px solid var(--c-primary)}
.sk-sum{font-size:13px;color:var(--c-text-sub);margin-bottom:8px}.sk-sum b{color:var(--c-heading);font-size:15px}
.sk{display:flex;flex-wrap:wrap;gap:6px}
.sk span{font-size:13px;border-radius:999px;padding:3px 10px}
.sk .ok{background:#eef6e8;color:#509e1f}
.sk .no{background:var(--c-warn-light);color:var(--c-warn)}
.tipbox{background:var(--c-primary-light);color:var(--c-primary-dark);border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.6}
.gleg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--c-text-sub);margin-bottom:12px}
.gleg span{display:inline-flex;align-items:center;gap:6px}
.gleg i{width:14px;height:8px;border-radius:4px;background:var(--c-primary)}
.gleg i.warn{background:var(--c-warn)}
.gleg i.req{background:#c9ced6}
.gb{gap:12px}
.gbar{display:grid;grid-template-columns:84px 1fr 44px 40px;align-items:center;gap:10px;font-size:14px}
.bx .gbar{grid-template-columns:112px 1fr 48px 48px}
.gt{display:flex;flex-direction:column;gap:4px}
.gt .track{height:8px;border-radius:4px}
.gv{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;font-variant-numeric:tabular-nums}
.gv b{font-size:13px;color:var(--c-heading)}.gv b.w{color:var(--c-warn)}
.gv small{font-size:11px;color:var(--c-text-sub)}
.gd{font-size:12px;font-weight:700;text-align:center;border-radius:999px;padding:1px 0;background:#eef6e8;color:#509e1f}
.gd.w{background:var(--c-warn-light);color:var(--c-warn)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;background:#f3f3f3;color:var(--c-text-sub);font-weight:700;font-size:13px;line-height:1.4;padding:6px 10px;border-bottom:1px solid var(--c-border);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid #eeeeee;vertical-align:middle}
.t.nw th,.t.nw td{white-space:nowrap}
.tbl{overflow-x:auto}
.tbl:has(th .tip){overflow:visible}

.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.b-ok{background:var(--c-ok-light);color:var(--c-ok)}.b-warn{background:var(--c-warn-light);color:var(--c-warn)}
.b-danger{background:var(--c-danger-light);color:var(--c-danger)}.b-blue{background:var(--c-primary-light);color:var(--c-primary)}
.b-line{background:#fff;border:1px solid var(--c-border);color:var(--c-text-sub);font-weight:400}
.lock{color:var(--c-text-sub);font-size:13px}.lock::before{content:"🔒 "}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:4px;padding:8px 14px;font-weight:700;text-decoration:none;font-size:14px;white-space:nowrap;cursor:pointer}
.btn-blue{background:var(--c-primary);color:#fff}
.btn-line{background:#fff;color:var(--c-primary);border-color:var(--c-primary)}
.btn-buy{background:var(--c-primary);color:#fff}
.btn-buy:hover{background:#009aa3}
.btn-gray{background:#fff;color:var(--c-text);border-color:var(--c-border);font-weight:400}
.btn-gray:hover{border-color:var(--c-primary);color:var(--c-primary)}
.btn-line:hover{background:var(--c-primary-light)}
td.act{text-align:right;white-space:nowrap}
td.act .btn{width:126px;justify-content:center;padding-left:6px;padding-right:6px}
.cmpt td{white-space:nowrap}.cmpt td:first-child{white-space:normal}
.btn-sm{padding:4px 10px;font-size:13px}
select{padding:7px 10px;border:1px solid var(--c-border);border-radius:4px;background:#fff}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pick{border:1px solid var(--c-border);border-radius:999px;padding:4px 12px;background:#fff;font-size:13px;color:var(--c-text);text-decoration:none}
.pick.on{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.ai{background:linear-gradient(90deg,#e6f9fa,#f3f7ff);border:1px solid #c5f3f5;border-radius:var(--radius);padding:14px 16px;font-size:14px}
.ai .t{font-weight:700;color:var(--c-primary);margin-bottom:4px}

/* 標籤式資訊 */
.jc{display:flex;flex-direction:column;gap:10px}
.jc>div{display:flex;align-items:flex-start;gap:12px}
.jc>div>b{flex:none;width:72px;font-size:13px;font-weight:400;color:var(--c-text-sub);line-height:24px}
.jc .cs{display:flex;flex-wrap:wrap;gap:6px}
.jc .cs i{font-style:normal;font-size:13px;line-height:1.4;padding:2px 8px;border-radius:4px;background:var(--c-bg);color:var(--c-text)}
.jc .cs.ab i{background:var(--c-primary-light);color:var(--c-primary-dark)}
.jc .cs.ab em{font-style:normal;font-weight:700}
.jc .cs.skl i{background:var(--c-accent-light);color:var(--c-accent)}
.jc .cs.gp i{background:var(--c-warn-light);color:#b35400}
.jc .cs.gp i.ok{background:var(--c-ok-light);color:var(--c-ok)}

/* 比較狀態 */
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;white-space:nowrap}
.st-h{background:var(--c-danger-light);color:#c22c40}
.st-m{background:var(--c-warn-light);color:#b35400}
.st-n{background:var(--c-bg);color:var(--c-text-sub)}
.st-g{background:var(--c-ok-light);color:var(--c-ok)}
.st-l{background:#fff;color:var(--c-text-sub);border:1px dashed var(--c-border);font-weight:400}
.hm td.c{cursor:pointer;text-align:center}
.hm td.c:hover{background:var(--c-primary-light)}
.hm td.c small{display:block;font-size:12px;color:var(--c-text-sub);margin-top:2px}
.hm th.c{text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--c-text-sub);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.bench-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 18px;margin-bottom:16px;font-size:14px}
.bench-bar b{color:var(--c-heading)}
.bench-bar .sep{width:1px;height:18px;background:var(--c-border)}
.vs{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.vs>div small{display:block;font-size:12px;color:var(--c-text-sub)}
.vs>div b{font-size:24px;font-weight:900;color:var(--c-heading);font-variant-numeric:tabular-nums}
.vs>div.mk b{color:#8a929c}
.vs .st{margin-left:auto}
.vs>div.df{padding-left:20px;border-left:1px solid var(--c-line,#e4e4e4)}
.vs>div.df b{font-size:20px}
.vs>div.df.w b,.vs>div.df.w .pct{color:var(--c-warn,#ff7800)}
.vs>div.df.ok b,.vs>div.df.ok .pct{color:#509e1f}
.vs .pct{font-size:14px;font-weight:700}
.rel{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #eeeeee;font-size:13px}
.rel a{font-weight:700;text-decoration:none}
.cmpt td.mkv{color:#5f6770}
.cmpt tr.opened td{background:var(--c-primary-light);border-bottom-color:transparent}
.cmpt .btn.on{background:var(--c-primary);color:#fff}
.xrow>td{padding:0 10px 14px;background:var(--c-primary-light);white-space:normal}
.xp{background:#fff;border:1px solid #cdeff1;border-radius:var(--radius);padding:14px 16px}
.xp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.xp-h b{font-size:14px;color:var(--c-heading)}
.xp .vs>div b{font-size:22px}
.xt th{background:#fafafa}
.xrow.flash .xp{box-shadow:0 0 0 2px var(--c-primary);transition:box-shadow .3s}
.cmpt .na{color:#a9a9a9;font-size:14px}
.home2{grid-template-columns:1fr;align-items:start}
.rtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:4px 0 0;padding-bottom:12px;border-bottom:2px solid var(--c-primary)}
.rtab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--c-border);background:#fff;border-radius:6px;padding:10px 12px;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.rtab:hover{border-color:var(--c-primary)}
.rtab b{font-size:15px;color:var(--c-heading)}
.rtab small{font-size:12px;color:var(--c-text-sub)}
.rtab .rc{margin-top:4px;font-size:12px;font-weight:700;border-radius:4px;padding:1px 8px}
.rtab .rc.h{background:var(--c-danger-light);color:#c22c40}.rtab .rc.m{background:var(--c-warn-light);color:#b35400}.rtab .rc.n{background:var(--c-ok-light);color:var(--c-ok)}
.rtab.on{border-color:var(--c-primary);background:var(--c-primary-light);box-shadow:0 0 0 1px var(--c-primary)}
.rtab.on::after{content:"";position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--c-primary)}
.rtabs+.tbl,.morep+.tbl{margin-top:12px}
.rtab.more{border-style:dashed;background:#fafafa}
.chips-r{display:flex;flex-wrap:wrap;gap:8px}
.rchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--c-border);background:#fff;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:400;line-height:1.5;color:var(--c-text);cursor:pointer;transition:border-color .2s,background .2s}
.chips-r{gap:6px}
.rchip.on{font-weight:700}
.dot{width:8px!important;height:8px!important}
.rchip:hover{border-color:var(--c-primary);color:var(--c-primary-dark)}
.rchip.on{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.h{background:var(--c-danger)}.dot.m{background:#f5c000}.dot.g{background:#6cc24a}
.rchip.on .dot{box-shadow:0 0 0 2px #fff}
.dot-leg{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--c-text-sub);margin:10px 0 0;padding-bottom:12px;border-bottom:2px solid var(--c-primary)}
.dot-leg span{display:inline-flex;align-items:center;gap:6px}
.dot-leg+.tbl{margin-top:12px}
.rsel{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--c-primary)}
.rsel-l{font-size:14px;color:var(--c-text-sub)}
.rsel-btn{display:flex;align-items:center;gap:12px;border:1px solid var(--c-primary);background:#fff;border-radius:6px;padding:9px 14px;min-width:420px;text-align:left;cursor:pointer;transition:box-shadow .2s}
.rsel-btn:hover,.rsel-btn.open{box-shadow:0 0 0 2px var(--c-primary-light)}
.rsel-btn b{font-size:17px;color:var(--c-heading)}
.rsel-btn .caret{margin-left:auto;color:var(--c-primary);font-size:14px}
.rsel-nav{display:inline-flex;align-items:center;gap:6px}
.rsel-step{width:36px;height:36px;border:1px solid var(--c-border);border-radius:6px;background:#fff;font-size:20px;line-height:1;color:var(--c-text);cursor:pointer}
.rsel-step:hover{border-color:var(--c-primary);color:var(--c-primary)}
.morep.dd{position:absolute;top:calc(100% - 8px);left:0;width:min(640px,100%);z-index:25;margin-top:0;box-shadow:0 6px 18px rgba(41,41,41,.18)}
.rsel+.tbl{margin-top:12px}
@media (max-width:860px){.rsel-btn{min-width:0;width:100%;flex-wrap:wrap}}
@media (max-width:860px){.rtabs{grid-template-columns:1fr 1fr!important}}
.rtab.more.open{border-style:solid;border-color:var(--c-primary)}
.morep{margin-top:12px;border:1px solid var(--c-border);border-radius:6px;padding:12px;background:#fff}
.morep input[type=search]{padding:7px 10px;border:1px solid var(--c-border);border-radius:4px;min-width:200px}
.morep .tbl{max-height:260px;overflow-y:auto}
.morep tr.click{cursor:pointer}
.morep tr.click:hover td{background:var(--c-primary-light)}
.morep tr.cur td{background:var(--c-primary-light);font-weight:700}
.card-h .hint.ind{gap:8px;font-size:14px;color:var(--c-text)}
.card-h .hint.ind .tip:hover::after,.card-h .hint.ind .tip:focus::after{left:-6px;right:auto;transform:none;bottom:auto;top:calc(100% + 6px)}
.cats{display:flex;flex-direction:column;gap:10px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--c-border);flex-wrap:wrap}

    const L=(S.srole?rs.filter(r=>r.id===S.srole):rs).flatMap(r=>lagPeople(r,'pay').map(x=>({...x,r,m:mPay(r),d:Math.round((x.p.pay-mPay(r))/mPay(r)*100)})));
    const PR={'A+':0,'A':1,'B+':2,'B':3}, isHi=x=>x.p.perf[2].startsWith('A');
    const SORTS={hi:['高績效優先',(x,y)=>(isHi(y)-isHi(x))||(PR[x.p.perf[2]]-PR[y.p.perf[2]])||(x.d-y.d)],gap:['差距大到小',(x,y)=>x.d-y.d],perf:['績效高到低',(x,y)=>(PR[x.p.perf[2]]-PR[y.p.perf[2]])||(x.d-y.d)]};
    if(!SORTS[S.ssort]) S.ssort='hi'; L.sort(SORTS[S.ssort][1]);
    const hiP=L.filter(isHi), avgD=L.length?Math.round(L.reduce((s,x)=>s+x.d,0)/L.length):0;
    const all=S.pmore&&S.pmore.sal, sh=all?L:L.slice(0,15);
    return head('','薪資競爭力檢視','找出月薪低於同產業優質企業同職務中位數 5% 以上的員工，優先檢視高績效但薪資落後市場的人才，降低流失風險。')+
    `<div class="filters">職務：<select id="salRole"><option value="">全部職務</option>${rs.map(r=>`<option value="${r.id}" ${S.srole===r.id?'selected':''}>${r.name}</option>`).join('')}</select>排序：<select id="salSort">${Object.entries(SORTS).map(([k,[n]])=>`<option value="${k}" ${S.ssort===k?'selected':''}>${n}</option>`).join('')}</select><span class="sub">比較產業：${IND[S.ind].n}</span></div>
    <div class="grid g4">${(()=>{const c=xs=>Math.round(xs.reduce((s,x)=>s+(x.m-x.p.pay),0)*12/10000);return kpi('調到市場中位數',`每年約 ${fmt(c(L))} 萬`,'把名單內所有人的月薪調到優質企業同職務中位數，每年需增加的人事成本（以 12 個月試算，未含勞健保等）。',`其中高績效 ${hiP.length} 位約 ${fmt(c(hiP))} 萬`)})()}${kpi('低於市場人數',`${L.length} <small style="font-size:14px;font-weight:400">/ ${tot} 位</small>`,'月薪低於優質企業同職務中位數 5% 以上')}${kpi('其中高績效',`${hiP.length} 位`,'最近一次績效 A 以上，流失風險較高，建議優先檢視','','warn')}${kpi('平均差距',`低 ${-avgD}%`,'這些員工月薪與優質企業中位數的平均差距')}</div>
    <div class="mt">${card(`人員清單（${L.length} 位）`,['mkt','pay','perf'],L.length?`<div class="tbl"><table class="t nw"><thead><tr><th>姓名</th><th>近一年績效</th><th>月薪</th><th><span style="display:inline-flex;align-items:center;gap:4px">優質企業中位數${tip(`${IND[S.ind].n}優質企業中，同職務員工月薪由低到高排列，取正中間的數字。資料來源：104 人力銀行市場職務資料。`)}</span></th><th><span style="display:inline-flex;align-items:center;gap:4px">差異${tip('（員工月薪 − 優質企業中位數）÷ 優質企業中位數。低於 10% 以上以紅色標示。')}</span></th></tr></thead><tbody>${sh.map(x=>`<tr class="${isHi(x)?'hiperf':''}"><td><b>${x.p.name}</b><div class="sub">${x.r.name}｜${x.r.dept}</div></td><td><b>${x.p.perf[2]}</b>${isHi(x)?' <span class="badge b-warn">高績效</span>':''}</td><td>${money(x.p.pay)}</td><td class="mkv">${money(x.m)}</td><td><span class="st st-${x.d<=-10?'h':'m'}">低 ${-x.d}%${isMgr()?'':`｜−${fmt(x.m-x.p.pay)} 元`}</span></td></tr>`).join('')}</tbody></table></div>${L.length>15?`<button class="btn btn-line btn-sm more" style="display:block;margin:10px auto 0" data-pmore="sal">${all?'收合':`顯示全部 ${L.length} 位`}</button>`:''}`:'<p class="sub">目前沒有月薪低於市場的人員</p>',L.length?`<span style="margin-left:auto;display:inline-flex;align-items:center;gap:10px"><a class="btn btn-line btn-sm" href="#" data-toast="前往薪酬平台試算調薪預算（示意）">至薪酬平台試算調薪預算</a></span>`:'')}</div>`;
  },
  salaryOld(){
    const rows=DEPTS.map(d=>{const diff=Math.round((d.pay-CO_MEDIAN)/CO_MEDIAN*100);
      if(isMgr()&&d.name!==MY_DEPT) return `<tr><td>${d.name}</td><td colspan="4"><span class="lock">無權限檢視其他部門薪資</span></td></tr>`;
      return `<tr><td><b>${d.name}</b></td><td>${d.n}</td><td>${money(d.pay)}</td><td>${diff>=0?'高 '+diff:'低 '+Math.abs(diff)}%</td><td>${diff<=-15?'<span class="badge b-danger">明顯偏低</span>':diff<=-8?'<span class="badge b-warn">偏低</span>':'<span class="badge b-ok">合理</span>'}</td></tr>`}).join('');
    const under=visP().filter(p=>p.pay<DEPTS.find(d=>d.name===p.dept).pay*0.95&&p.perf[2].startsWith('A'));
    return head('人才管理 › 薪資合理性','薪資合理性','各部門與高績效員工的薪資，是否與表現相稱。','與市場的薪資比較，請看「職務比較」的薪資面向。')+
    `<div class="grid g2">${card('各部門平均月薪 vs 公司中位數',['pay','org'],`<div class="tbl"><table class="t nw"><thead><tr><th>部門</th><th>人數</th><th>平均月薪</th><th><span style="display:inline-flex;align-items:center;gap:4px">公司中位數${tip('公司中位數：'+money(CO_MEDIAN)+'。把全公司員工月薪由低到高排列，排在正中間的那個數字。')}</span></th><th><span style="display:inline-flex;align-items:center;gap:4px">狀態${tip('低於公司中位數 8% 為偏低、低於 15% 為明顯偏低。')}</span></th></tr></thead><tbody>${rows}</tbody></table></div>`)}
    ${card('高績效但薪資偏低的員工'+tip('最近一次績效 A 以上，且月薪低於部門平均 5% 以上。'),['pay','perf'],under.length?`<div class="uplist">${under.map(p=>{const avg=DEPTS.find(d=>d.name===p.dept).pay,diff=p.pay-avg,pct=Math.round(diff/avg*100),w=Math.round(p.pay/avg*100);
        return `<div class="up"><div class="up-h"><span><b>${p.name}</b><span class="sub">${p.dept}｜近一年績效 ${p.perf[2]}</span></span><span class="up-gap">低 ${Math.abs(pct)}%${isMgr()?'':`<small>（−${fmt(Math.abs(diff))} 元）</small>`}</span></div>
          <div class="up-bar"><i style="width:${w}%"></i></div>
          <div class="up-v"><span>目前 ${money(p.pay)}</span><span>部門平均 ${money(avg)}</span></div></div>`}).join('')}</div>`:'<p class="sub">目前沒有</p>')}</div>`;
  }
};

/* ===== 路由 ===== */
function setRole(r,silent){
  S.role=r; const R=ROLES[r];
  document.querySelectorAll('#whoMenu [data-role]').forEach(x=>x.classList.toggle('on',x.dataset.role===r));
  $('#av').textContent=R.av; $('#whoName').textContent=R.nm;
  if(window.aiReset) setTimeout(aiReset,0);
  if(!silent) toast(R.msg);
}
function setPlan(p,silent){
  S.plan=p;
  whoMenu.querySelectorAll('[data-plan]').forEach(x=>x.classList.toggle('on',x.dataset.plan===p));
  if(window.aiReset) setTimeout(aiReset,0);
  if(!silent) toast(p==='full'?'已切換為全部啟用：六個面向皆可比較':'已切換為部分啟用：未啟用產品的面向會鎖定');
}
function render(){
  applyInd();
  const h=decodeURIComponent(location.hash.replace('#',''))||'home';
  const [page,a,b]=h.split('--');
  if(page==='home'&&ROLES[a]&&a!==S.role) setRole(a,true);
  if(PLANS[b]&&b!==S.plan) setPlan(b,true);
  /* 職務落差分析已併入人才市場分析：#bench--職務--面向 → 總覽並展開該列 */
  if(page==='bench'){if(a){S.hrole=a;S.brole=a}S.open={};if(b)S.open[b]=true;S.goId=a&&b?`go-${a}-${b}`:'';try{history.replaceState(null,'','#home')}catch(e){}}
  /* C 版已移除人才盤點、升遷評估（B 版有），舊連結導回首頁 */
  const fn=page==='bench'||page==='review'||page==='promo'||(page==='watch'&&!WATCH_ON)?'home':(PAGES[page]?page:'home');
  if(fn==='issues'&&a===undefined){S.irole='';S.ilv='';}
  if(fn==='issues'&&a&&a!=='lvh'&&!a.startsWith('dim-')&&!a.startsWith('grp-')) S.ilv='';
  if(fn==='issues'&&!(a&&a.startsWith('grp-'))&&!S.keepF) S.igrp='';
  S.keepF=false;
  renderNav(fn);
  const miss=missing(fn);
  const body=miss.length?head('',FEAT[fn],'')+buyBox(miss,`啟用${miss.map(k=>SRC[k].prod).join('、')}，即可使用「${FEAT[fn]}」`):PAGES[fn](a,b);
  $('#main').innerHTML=`<div class="fade">${body}</div>`;
  setTimeout(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'),50);
  bind();
  if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.side')) document.activeElement.blur();
  const gid=S.goId; S.goId='';
  const go=(gid&&document.getElementById(gid))||(b&&document.getElementById('go-'+a+'-'+b));
  if(go&&(gid||location.hash!==render.last)){render.last=location.hash;setTimeout(()=>{go.scrollIntoView({behavior:'smooth',block:'start'});go.classList.add('flash');setTimeout(()=>go.classList.remove('flash'),1800)},80);}
  else if(location.hash!==render.last){window.scrollTo(0,0);render.last=location.hash;}
}
function bind(){
  const is=$('#indSel'); if(is) is.onchange=()=>{S.ind=is.value;toast('已切換比較產業：'+IND[S.ind].n);const y=window.scrollY;render();window.scrollTo(0,y)};
  const ir0=document.querySelector('[data-indreset]'); if(ir0) ir0.onclick=e=>{e.preventDefault();S.ind=CO_IND;toast('已回到本公司產業：'+IND[CO_IND].n);const y=window.scrollY;render();window.scrollTo(0,y)};
  /* 管理議題與職務可同時篩選：切換其中一個時保留另一個 */
  const reIss=()=>{S.keepF=true;const y=window.scrollY;try{history.replaceState(null,'','#issues--'+(S.irole||''))}catch(e){}render.last=location.hash;render();window.scrollTo(0,y)};
  const ir=$('#iroleSel'); if(ir) ir.onchange=()=>{S.irole=ir.value;reIss()};
  document.querySelectorAll('[data-igrp]').forEach(b=>b.onclick=()=>{S.igrp=b.dataset.igrp;reIss()});
  document.querySelectorAll('[data-ifilter]').forEach(c=>{const go=e=>{if(e.target.closest('.tip'))return;const f=c.dataset.ifilter;
    if(f==='lock'){const lb=$('#lockbox');if(lb)lb.scrollIntoView({behavior:'smooth',block:'center'});return}
    S.ilv=f==='all'?'':f;if(f==='all'){S.idim='';S.irole=''}const y=window.scrollY;render();window.scrollTo(0,y)};
    c.onclick=go;c.onkeydown=e=>{if(e.key==='Enter')go(e)}});
  const pm=$('#pbMini'), pn=SRC_ORDER.filter(has).length;
  pm.hidden=!S.pbClosed||isMgr(); pm.innerHTML=`已啟用 <b>${pn}</b> / 6 項 104 產品 ▾`;
  pm.onclick=()=>{S.pbClosed=false;try{sessionStorage.removeItem('t360_pb')}catch(e){};render();window.scrollTo({top:0,behavior:'smooth'})};
  const px=document.querySelector('[data-pbclose]'); if(px) px.onclick=()=>{S.pbClosed=true;try{sessionStorage.setItem('t360_pb','1')}catch(e){};const y=window.scrollY;render();window.scrollTo(0,y);toast('已收合到右上角，點「已啟用 N / 6」可再展開')};
  document.querySelectorAll('[data-xp]').forEach(b=>b.onclick=e=>{e.preventDefault();S.open=S.open||{};const k=b.dataset.xp;S.open[k]=!S.open[k];const y=window.scrollY;render();window.scrollTo(0,y)});
  document.querySelectorAll('[data-hrole]').forEach(b=>b.onclick=()=>{S.hrole=b.dataset.hrole;if(b.dataset.hrole!=='all')S.brole=b.dataset.hrole;S.moreOpen=false;if(b.dataset.xopen){S.open={};S.open[b.dataset.xopen]=true}const y=window.scrollY;render();window.scrollTo(0,y)});
  const mo=document.querySelector('[data-more]'); if(mo) mo.onclick=()=>{S.moreOpen=!S.moreOpen;const y=window.scrollY;render();window.scrollTo(0,y);const q=$('#roleQ');if(q)q.focus()};
  const rq=$('#roleQ'), rd=$('#roleD');
  const rf=()=>{const q=(rq.value||'').trim(),d=rd.value;let c=0;document.querySelectorAll('.morep tr[data-hrole]').forEach(tr=>{const ok=(!q||tr.dataset.name.includes(q))&&(!d||tr.dataset.dept===d);tr.hidden=!ok;if(ok)c++});document.querySelector('.morep .nores').hidden=c>0};
  if(rq){rq.oninput=rf;rd.onchange=rf}
  document.querySelectorAll('[data-pmore]').forEach(b=>b.onclick=()=>{S.pmore=S.pmore||{};S.pmore[b.dataset.pmore]=!S.pmore[b.dataset.pmore];const y=window.scrollY;render();window.scrollTo(0,y)});
  document.querySelectorAll('[data-ipeople]').forEach(b=>b.onclick=()=>{S.iopen=S.iopen||{};S.iopen[b.dataset.ipeople]=!S.iopen[b.dataset.ipeople];const y=window.scrollY;render();window.scrollTo(0,y)});
  document.querySelectorAll('[data-idim]').forEach(b=>b.onclick=()=>{S.idim=b.dataset.idim;const y=window.scrollY;try{history.replaceState(null,'','#issues--'+(S.irole||''))}catch(e){}render.last=location.hash;render();window.scrollTo(0,y)});
  document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{S.track.push(b.dataset.track);toast('已列入改善計畫（示意）');const y=window.scrollY;render();window.scrollTo(0,y)});
  const wr=$('#wRole'); if(wr) wr.onchange=()=>{location.hash='watch--'+wr.value};
  document.querySelectorAll('[data-wtab]').forEach(b=>b.onclick=e=>{if(e.target.closest('.tip'))return;S.wtab=b.dataset.wtab;if(S.pmore)S.pmore.w=false;const y=window.scrollY;render();window.scrollTo(0,y)});
  const sr=$('#salRole'); if(sr) sr.onchange=()=>{location.hash='salary--'+sr.value};
  const ss=$('#salSort'); if(ss) ss.onchange=()=>{S.ssort=ss.value;const y=window.scrollY;render();window.scrollTo(0,y)};
  const ps=$('#promoSel'); if(ps) ps.onchange=()=>{S.job=ps.value;S.picks=[];render()};
  const pp=$('#pathP'), pj=$('#pathJ');
  if(pp) pp.onchange=()=>{S.pathP=pp.value; location.hash='path--'+S.pathP+'--'+S.pathJ};
  if(pj) pj.onchange=()=>{S.pathJ=pj.value; location.hash='path--'+S.pathP+'--'+S.pathJ};
  document.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.pick;
    if(S.picks.includes(id)){if(S.picks.length<=2){toast('至少需要 2 位候選人');return}S.picks=S.picks.filter(x=>x!==id)}
    else{if(S.picks.length>=4){toast('最多比較 4 位候選人');return}S.picks.push(id)} render();});
}
const closeRole=()=>{S.moreOpen=false;const y=window.scrollY;render();window.scrollTo(0,y)};
document.addEventListener('click',e=>{if(S.moreOpen&&!e.target.closest('.rsel'))closeRole()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.moreOpen)closeRole()});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toast]'); if(t){e.preventDefault();toast(t.dataset.toast);return}
  if(e.target.closest('a,button,select,input,.tip')) return;
  const g=e.target.closest('[data-go]'); if(g) location.hash=g.dataset.go;
});
const whoMenu=$('#whoMenu'), whoBtn=$('#whoBtn');
whoBtn.onclick=e=>{e.stopPropagation();whoMenu.hidden=!whoMenu.hidden;whoBtn.setAttribute('aria-expanded',String(!whoMenu.hidden))};
document.addEventListener('click',e=>{if(!e.target.closest('.who')){whoMenu.hidden=true;whoBtn.setAttribute('aria-expanded','false')}});
whoMenu.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{whoMenu.hidden=true;setRole(b.dataset.role);if(location.hash==='#home')render();else location.hash='#home'});
whoMenu.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{whoMenu.hidden=true;setPlan(b.dataset.plan);render()});
document.querySelector('a.why').addEventListener('click',e=>{e.preventDefault();location.href=new URL('./',location.href).href;});
window.addEventListener('hashchange',render);
render();

.ai-q button:nth-child(3n),.ai-m .act a:nth-child(3n){border-color:#ea580c;background:#fff7ed;color:#ea580c}
.ai-q button:hover,.ai-m .act a:hover{filter:brightness(.96)}
.ai-in{display:flex;align-items:flex-end;gap:8px;margin:0 16px;border:1px solid #dddddd;border-radius:20px;background:rgba(255,255,255,.9);padding:8px 8px 8px 14px;box-shadow:0 4px 16px rgba(0,175,184,.15);min-height:72px}
.ai-in input{flex:1;align-self:flex-start;border:0;outline:none;background:transparent;font:inherit;font-size:16px;color:#292929;padding-top:2px}
.ai-in input::placeholder{color:#7e7e7e}
.ai-in button{width:32px;height:32px;border-radius:50%;border:0;background:#00afb8;color:#fff;cursor:pointer;font-size:14px;flex:none}
.ai-ft{font-size:12px;color:#7e7e7e;text-align:center;padding:8px 16px 12px}
.ai-typing{color:#7e7e7e;font-size:13px}
@media (max-width:560px){.ai-fab{right:12px;bottom:16px}.totop{right:29px!important;bottom:112px!important}.ai-pn{width:100%}}

<button class="ai-fab" id="aiFab" type="button" aria-label="開啟 AI HR 顧問"><span class="ic"><svg><use href="#aiLogo"/></svg></span><span class="lb">AI HR顧問</span></button>
<aside class="ai-pn" id="aiPn" aria-label="AI HR 顧問" aria-hidden="true">
  <div class="ai-hd"><span class="lg"><svg><use href="#aiLogo"/></svg></span><b>AI HR顧問</b><span class="beta">BETA</span><button type="button" id="aiX" aria-label="關閉">✕</button></div>
  <div class="ai-log" id="aiLog" aria-live="polite"></div>
  <div class="ai-q" id="aiQ"></div>
  <form class="ai-in" id="aiForm"><input id="aiIn" placeholder="描述您想了解的人才問題" aria-label="輸入問題"><button type="submit" aria-label="送出">➤</button></form>
  <div class="ai-ft">提醒您勿輸入敏感資料。AI 生成內容可能有誤，請再次檢查。（示意）</div>
</aside>
<script>
(function(){
  const fab=$('#aiFab'),pn=$('#aiPn'),log=$('#aiLog'),qb=$('#aiQ');
  const page=()=>(decodeURIComponent(location.hash.replace('#',''))||'home').split('--')[0];
  const lit=r=>hiN(r)?'🔴':lagN(r)?'🟡':'🟢';
  const worstR=()=>visR().slice().sort((a,b)=>hiN(b)-hiN(a)||lagN(b)-lagN(a))[0];
  const lagDims=r=>DIMK.filter(d=>has(d.src)&&['h','m'].includes(stat(r,d.k).lv)).sort((a,b)=>(stat(r,a.k).lv==='h'?0:1)-(stat(r,b.k).lv==='h'?0:1));
  const act=a=>a.length?`<div class="act">${a.map(([t,h])=>`<a href="${h}" data-aigo>${t}</a>`).join('')}</div>`:'';
  /* 回覆內容（依目前資料產生） */
  const A={
    overview(){const rs=visR().filter(r=>lagN(r)).sort((a,b)=>hiN(b)-hiN(a)||lagN(b)-lagN(a)).slice(0,3);
      if(!rs.length) return `目前各職務都達到${IND[S.ind].n}優質企業的水準 👍`;
      return `和${IND[S.ind].n}優質企業比較，落後最多的職務：<ul>${rs.map(r=>`<li>${lit(r)} <b>${r.name}</b>：${lagDims(r).map(d=>d.n+(stat(r,d.k).lv==='h'?'（明顯落後）':'')).join('、')}</li>`).join('')}</ul>${act(rs.map(r=>[`看${r.name}`,`#bench--${r.id}--${lagDims(r)[0].k}`]))}`},
    role(id){const r=brole(id),ds=lagDims(r);if(!ds.length) return `${r.name}各面向都達到優質企業水準。`;
      const d=ds[0],L=lagPeople(r,d.k);
      return `<b>${r.name}</b>（${r.dept}｜${r.n} 人）有 ${ds.length} 個面向落後：<ul>${ds.map(x=>`<li>${x.n}：${stat(r,x.k).txt}</li>`).join('')}</ul>最需要處理的是<b>${d.n}</b>，共有 ${L.length} 位員工低於優質企業平均。${act([[`看${d.n}詳細分析`,`#bench--${r.id}--${d.k}`],['看改善建議',`#issues--${r.id}--${d.k}`]])}`},
    people(){const ab=r=>lagDims(r).filter(d=>['skill','comp','learn'].includes(d.k)),r=visR().filter(x=>ab(x).length).sort((a,b)=>ab(b).length-ab(a).length)[0],d=r&&ab(r)[0];if(!d) return '目前沒有需要補強能力的人員。';const L=lagPeople(r,d.k).slice(0,3);
      return `以落後最多的<b>${r.name}</b>為例，${d.n}落差最大的前 3 位：<ul>${L.map(x=>`<li><b>${x.p.name}</b>：${x.g.slice(0,2).join('、')}</li>`).join('')}</ul>建議先從這幾位安排補強，點姓名可看與優質企業的落差和學習建議。${act(L.map(x=>[x.p.name,`#path--${x.p.id}--mk-${r.id}`]))}`},
    pay(){if(!has('pay')) return isMgr()?'目前公司還沒有薪資資料，無法和市場比較。如需這項分析，請洽 HR 啟用薪酬平台。':`目前還沒有薪資資料，無法和市場比較。啟用薪酬平台後，我可以幫你找出薪資落後市場的人，並試算調薪預算。${act([['了解薪酬平台 ↗',SRC.pay.url]])}`;
      const L=visR().flatMap(r=>lagPeople(r,'pay').map(x=>({...x,m:mPay(r)}))).filter(x=>x.p.perf[2].startsWith('A'));
      const cost=L.reduce((s,x)=>s+(x.m-x.p.pay),0)*12;
      return `有 <b>${L.length} 位高績效員工</b>月薪低於優質企業中位數 5% 以上，流失風險較高。${isMgr()?'':`<br>若調到市場中位數，每年約需增加 <b>${fmt(Math.round(cost/10000))} 萬元</b>人事成本（以 12 個月試算）。`}${act([['看薪資競爭力檢視','#salary']])}`},
    priority(){const is=allIssues().slice(0,3);if(!is.length) return '目前沒有需要改善的項目。';
      return `建議依這個順序處理：<ul>${is.map(i=>`<li><b>${i.r.name}｜${i.short}</b>：${i.sol[0][0]}</li>`).join('')}</ul>${act(is.map(i=>[`${i.r.name}${dimOf(i.k).n}`,`#issues--${i.r.id}--${i.k}`]))}`},
    watch(){const L=visR().flatMap(r=>r.mem.map(p=>watchOf(r,p))),ret=L.filter(x=>x.cat==='ret').sort((a,b)=>b.score-a.score),dev=L.filter(x=>x.cat==='dev');
      return `我整合了績效、薪資、員工體驗和能力落差：<ul><li><b>優先留才 ${ret.length} 位</b>：績效好但${has('pay')||has('sat')?'薪資或體驗落後市場':'（需納入薪資或體驗資料才能判斷）'}${ret.length?`，例如${ret.slice(0,3).map(x=>x.p.name).join('、')}`:''}</li><li><b>優先補強 ${dev.length} 位</b>：績效偏低且能力落差大</li></ul>${act([['看優先關注名單','#watch']])}`},
    help(){return '我可以協助你：找出落後市場的職務、列出需要補強的人員、檢視薪資競爭力並試算調薪預算。請點下方的問題，或直接輸入。'}
  };
  const QS=()=>{const p=page(),r=worstR(),q=[];
    if(p==='issues') q.push(['要先處理哪幾項？','priority']);
    if(WATCH_ON) q.push(['哪些人要優先關注？','watch']);
    if(p==='path'||p==='issues'||p==='home') q.push(['需要補強的人有誰？','people']);
    if(p==='home'||p==='issues') q.push(['哪些職務落後最多？','overview']);
    if(r&&lagN(r)) q.push([`看${lit(r)}「${r.name}」的狀況`,'role:'+r.id]);
    q.push([p==='salary'?'調薪預算要多少？':'薪資有競爭力嗎？','pay']);
    return q.slice(0,4)};
  const add=(h,me)=>{const d=document.createElement('div');d.className='ai-m'+(me?' me':'');d.innerHTML=h;log.appendChild(d);log.scrollTop=log.scrollHeight};
  const chips=()=>{qb.innerHTML=QS().map(([t,k])=>`<button type="button" data-aiq="${k}">${t}</button>`).join('')};
  const say=(k,label)=>{add(label,true);const t=document.createElement('div');t.className='ai-m ai-typing';t.textContent='思考中…';log.appendChild(t);log.scrollTop=log.scrollHeight;
    setTimeout(()=>{t.remove();const[f,a]=k.split(':');add((A[f]||A.help)(a));chips()},500)};
  const greet=()=>{const nm=isMgr()?'陳協理':'王經理',r=worstR(),hi=visR().filter(x=>hiN(x));
    add(`Hi ${nm}，我是你的 AI HR 顧問 👋<br>職務旁的燈號代表和${IND[S.ind].n}優質企業比較的結果：<br>🟢 達市場水準　🟡 有落後　🔴 有明顯落後<br><br>${hi.length?`目前有 <b>${hi.length} 個職務亮紅燈</b>，其中<b>${r.name}</b>有 ${hiN(r)} 個面向明顯落後，建議優先關注。`:'目前沒有職務亮紅燈。'}<br>你想先從哪裡看起？`)};
  function open(){pn.classList.add('open');pn.setAttribute('aria-hidden','false');fab.hidden=true;if(!log.children.length)greet();chips();setTimeout(()=>$('#aiIn').focus(),250)}
  function close(){pn.classList.remove('open');pn.setAttribute('aria-hidden','true');fab.hidden=false}
  fab.onclick=open;$('#aiX').onclick=close;
  /* 切換身分或產品方案時，清空對話並以新身分重新開場 */
  window.aiReset=()=>{log.innerHTML='';if(pn.classList.contains('open')){greet();chips()}};
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&pn.classList.contains('open'))close()});
  qb.onclick=e=>{const b=e.target.closest('[data-aiq]');if(b)say(b.dataset.aiq,b.textContent)};
  log.onclick=e=>{const a=e.target.closest('[data-aigo]');if(a&&a.getAttribute('href').startsWith('#')&&innerWidth<=560)close()};
  $('#aiForm').onsubmit=e=>{e.preventDefault();const v=$('#aiIn').value.trim();if(!v)return;$('#aiIn').value='';
    const r=visR().find(x=>v.includes(x.name));
    const k=r?'role:'+r.id:WATCH_ON&&/關注|流失|離職|留才|風險/.test(v)?'watch':/薪|調薪|預算|成本/.test(v)?'pay':/誰|人員|補強|名單/.test(v)?'people':/先|優先|順序|處理/.test(v)?'priority':/職務|落後|哪個|哪些|市場/.test(v)?'overview':'help';
    say(k,v.replace(/[<>&]/g,''))};
  addEventListener('hashchange',()=>{if(pn.classList.contains('open'))chips()});
})();
</script>
<script>/* 記住目前頁面：artifact 更新重新載入後會回到這裡 */
(function(){try{var k='t360_last';function s(){sessionStorage.setItem(k,location.pathname.split('/').pop()+location.hash)}s();addEventListener('hashchange',s);
document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href')||'';if(h&&h.charAt(0)!=='#'&&/(^|\/)(index\.html)?$/.test(h))sessionStorage.removeItem(k)},true)}catch(e){}})();</script>
