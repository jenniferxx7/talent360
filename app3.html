<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人才360畫像（市場對標版）｜Talent One</title>
<style>
/* ===== 配色：104 HA 大B 設計公版（react-ha-v2 palette / colors / typography） ===== */
:root{
  --c-primary:#00afb8; --c-primary-dark:#014a50; --c-primary-light:#e6f9fa;
  --c-heading:#292929; --c-accent:#1654b9; --c-accent-light:#dbe8ff;
  --c-warn:#ff7800; --c-warn-light:#ffeedf; --c-danger:#ea475b; --c-danger-light:#ffe9ec;
  --c-ok:#509e1f; --c-ok-light:#e9f6dc;
  --c-bg:#f3f3f3; --c-surface:#ffffff; --c-border:#dddddd; --c-text:#292929; --c-text-sub:#7e7e7e;
  --radius:8px; --shadow:0 2px 4px 0 rgba(41,41,41,.1);
  --font:Arial,"PingFang TC","Microsoft JhengHei",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--c-text);background:var(--c-bg);line-height:1.6;font-size:15px}
a{color:var(--c-primary)}
button,select,input{font-family:inherit;font-size:14px}
button{cursor:pointer}

/* 品牌列 */
.appbar{position:sticky;top:0;z-index:40;height:60px;background:#fff;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid #eeeeee}
.logo{display:flex;align-items:center;gap:14px;white-space:nowrap;text-decoration:none}
.logo .mark{display:block;flex:none}
.logo .mk{height:30px;width:58px;overflow:hidden}
.logo .mk img{display:block;height:42px;width:auto;max-width:none;margin-top:-6px}
.logo .prod{font-weight:700;font-size:22px;line-height:1;color:#6f6f6f;letter-spacing:.5px}
.co{font-size:17px;color:var(--c-heading);white-space:nowrap;padding-left:14px;border-left:1px solid #a9a9a9;line-height:1.2}
.sp{flex:1}
.why{color:var(--c-accent);font-size:13px;text-decoration:none;white-space:nowrap}
.why:hover{text-decoration:underline}
.who{position:relative;white-space:nowrap}
.who-btn{display:flex;align-items:center;gap:8px;border:0;background:none;font-size:14px;color:var(--c-text);padding:4px 6px;border-radius:4px}
.who-btn:hover{background:var(--c-bg)}
.who-btn .caret{font-size:11px;color:var(--c-text-sub)}
.av{width:30px;height:30px;border-radius:50%;background:var(--c-primary-light);color:var(--c-primary);display:flex;align-items:center;justify-content:center;font-weight:900}
.who-menu{position:absolute;right:0;top:44px;z-index:50;min-width:220px;background:#fff;border:1px solid var(--c-border);border-radius:4px;box-shadow:0 2px 8px 0 rgba(41,41,41,.15);padding:6px}
.who-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;background:none;padding:8px 10px;border-radius:4px;text-align:left;font-size:14px;color:var(--c-text)}
.who-menu button:hover{background:var(--c-primary-light)}
.who-menu button.on b{color:var(--c-primary)}
.who-menu button span{font-size:12px;color:var(--c-text-sub)}
.who-menu .sec{font-size:12px;color:var(--c-text-sub);padding:8px 10px 4px;border-top:1px solid var(--c-border);margin-top:4px}
.who-menu .sec:first-child{border-top:0;margin-top:0}

/* 頁籤列 */
.side{position:sticky;top:60px;z-index:30;background:#fff;border-bottom:1px solid var(--c-border);box-shadow:0 2px 4px 0 rgba(41,41,41,.06)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px}
.tab-item{position:relative}
.tab-item>a{display:block;padding:12px 16px 9px;font-size:17px;color:var(--c-text);text-decoration:none;border-bottom:4px solid transparent;white-space:nowrap}
.tab-item:hover>a,.tab-item:focus-within>a{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.tab-item>a.on{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.tab-item>a small{font-size:12px;color:var(--c-text-sub);margin-left:4px}
.tab-item>a .cnt{display:inline-block;font-size:11px;font-weight:700;background:var(--c-danger);color:#fff;border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px;line-height:16px}
.drop{display:none;position:absolute;left:0;top:100%;z-index:45;min-width:180px;background:#fff;border:1px solid var(--c-border);border-radius:4px;box-shadow:0 2px 8px 0 rgba(41,41,41,.15);padding:6px}
.tab-item:hover .drop,.tab-item:focus-within .drop{display:block}
.drop a{display:block;padding:8px 12px;border-radius:4px;font-size:14px;color:var(--c-text);text-decoration:none;white-space:nowrap}
.drop a:hover{background:var(--c-bg);color:var(--c-primary)}
.drop a.on{background:var(--c-primary-light);color:var(--c-primary);font-weight:700}
.drop a.lk::after{content:" 🔒";font-size:11px}

main{padding:24px 28px 48px;max-width:1440px;margin:0 auto}
.crumb{font-size:13px;color:var(--c-text-sub);margin-bottom:4px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:26px;color:var(--c-heading);font-weight:900}
.ph p{color:var(--c-text-sub);font-size:14px}
.hello{font-size:22px;font-weight:900;color:var(--c-heading)}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{font-size:16px;color:var(--c-heading)}
.card-h .hint{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.card-src{margin-top:12px;padding-top:8px;border-top:1px solid #eeeeee;font-size:12px;color:var(--c-text-sub)}
.card-src a{color:var(--c-text-sub);text-decoration:none;border-bottom:1px dotted var(--c-text-sub)}
.card-src a:hover{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.mt{margin-top:16px}
.sub{font-size:13px;color:var(--c-text-sub)}
.kpi .l{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--c-text-sub)}
.kpi .n{font-size:26px;font-weight:900;color:var(--c-heading);line-height:1.3}
.kpi .n.r{color:var(--c-danger)}

.tip{position:relative;top:-1px;vertical-align:middle;flex:none;display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid #a9a9a9;color:#7e7e7e;font-size:10px;font-weight:700;line-height:1;cursor:help}
.tip:hover,.tip:focus{border-color:var(--c-primary);color:var(--c-primary);outline:none}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);width:230px;background:#292929;color:#fff;font-size:12px;font-weight:400;line-height:1.5;padding:8px 10px;border-radius:4px;z-index:60;text-align:left;white-space:normal;box-shadow:0 2px 8px 0 rgba(41,41,41,.15)}
.ph p .tip,.card-h h3 .tip,.sub .tip,.nine-def .tip{margin-left:4px}
.t th .tip:hover::after,.t th .tip:focus::after{bottom:auto;top:calc(100% + 6px)}
.card-h .hint .tip:hover::after,.card-h .hint .tip:focus::after{left:auto;right:-6px;transform:none}

.bars{display:flex;flex-direction:column;gap:10px}
.track{position:relative;height:10px;background:#eeeeee;border-radius:5px}
.fill{position:absolute;left:0;top:0;height:100%;background:var(--c-primary);border-radius:5px;width:0;transition:width .8s}
.fill.warn{background:var(--c-warn)}
.fill.req{background:#c9ced6}
.lockline{font-size:13px;color:var(--c-text-sub);margin-top:6px}
.lockline a{margin-left:6px;color:var(--c-primary);font-weight:700;text-decoration:none}
.gh{font-size:13px;font-weight:700;color:var(--c-heading);margin-bottom:8px;padding-left:8px;border-left:3px solid var(--c-primary)}
.sk-sum{font-size:13px;color:var(--c-text-sub);margin-bottom:8px}.sk-sum b{color:var(--c-heading);font-size:15px}
.sk{display:flex;flex-wrap:wrap;gap:6px}
.sk span{font-size:13px;border-radius:999px;padding:3px 10px}
.sk .ok{background:#eef6e8;color:#509e1f}
.sk .no{background:var(--c-warn-light);color:var(--c-warn)}
.tipbox{background:var(--c-primary-light);color:var(--c-primary-dark);border-radius:6px;padding:10px 14px;font-size:14px;line-height:1.6}
.gleg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--c-text-sub);margin-bottom:12px}
.gleg span{display:inline-flex;align-items:center;gap:6px}
.gleg i{width:14px;height:8px;border-radius:4px;background:var(--c-primary)}
.gleg i.warn{background:var(--c-warn)}
.gleg i.req{background:#c9ced6}
.gb{gap:12px}
.gbar{display:grid;grid-template-columns:84px 1fr 44px 40px;align-items:center;gap:10px;font-size:14px}
.bx .gbar{grid-template-columns:112px 1fr 48px 48px}
.gt{display:flex;flex-direction:column;gap:4px}
.gt .track{height:8px;border-radius:4px}
.gv{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;font-variant-numeric:tabular-nums}
.gv b{font-size:13px;color:var(--c-heading)}.gv b.w{color:var(--c-warn)}
.gv small{font-size:11px;color:var(--c-text-sub)}
.gd{font-size:12px;font-weight:700;text-align:center;border-radius:999px;padding:1px 0;background:#eef6e8;color:#509e1f}
.gd.w{background:var(--c-warn-light);color:var(--c-warn)}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;background:#f3f3f3;color:var(--c-text-sub);font-weight:700;padding:10px;border-bottom:1px solid var(--c-border);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid #eeeeee;vertical-align:middle}
.t.nw th,.t.nw td{white-space:nowrap}
.tbl{overflow-x:auto}
.tbl:has(th .tip){overflow:visible}

.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.b-ok{background:var(--c-ok-light);color:var(--c-ok)}.b-warn{background:var(--c-warn-light);color:var(--c-warn)}
.b-danger{background:var(--c-danger-light);color:var(--c-danger)}.b-blue{background:var(--c-primary-light);color:var(--c-primary)}
.b-line{background:#fff;border:1px solid var(--c-border);color:var(--c-text-sub);font-weight:400}
.lock{color:var(--c-text-sub);font-size:13px}.lock::before{content:"🔒 "}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:4px;padding:8px 14px;font-weight:700;text-decoration:none;font-size:14px;white-space:nowrap;cursor:pointer}
.btn-blue{background:var(--c-primary);color:#fff}
.btn-line{background:#fff;color:var(--c-primary);border-color:var(--c-primary)}
.btn-buy{background:var(--c-accent);color:#fff}
.btn-sm{padding:4px 10px;font-size:13px}
select{padding:7px 10px;border:1px solid var(--c-border);border-radius:4px;background:#fff}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pick{border:1px solid var(--c-border);border-radius:999px;padding:4px 12px;background:#fff;font-size:13px;color:var(--c-text);text-decoration:none}
.pick.on{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.ai{background:linear-gradient(90deg,#e6f9fa,#f3f7ff);border:1px solid #c5f3f5;border-radius:var(--radius);padding:14px 16px;font-size:14px}
.ai .t{font-weight:700;color:var(--c-primary);margin-bottom:4px}

/* 標籤式資訊 */
.jc{display:flex;flex-direction:column;gap:10px}
.jc>div{display:flex;align-items:flex-start;gap:12px}
.jc>div>b{flex:none;width:72px;font-size:13px;font-weight:400;color:var(--c-text-sub);line-height:24px}
.jc .cs{display:flex;flex-wrap:wrap;gap:6px}
.jc .cs i{font-style:normal;font-size:13px;line-height:1.4;padding:2px 8px;border-radius:4px;background:var(--c-bg);color:var(--c-text)}
.jc .cs.ab i{background:var(--c-primary-light);color:var(--c-primary-dark)}
.jc .cs.ab em{font-style:normal;font-weight:700}
.jc .cs.skl i{background:var(--c-accent-light);color:var(--c-accent)}
.jc .cs.gp i{background:var(--c-warn-light);color:#b35400}
.jc .cs.gp i.ok{background:var(--c-ok-light);color:var(--c-ok)}

/* 對標狀態 */
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;white-space:nowrap}
.st-h{background:var(--c-danger-light);color:#c22c40}
.st-m{background:var(--c-warn-light);color:#b35400}
.st-n{background:var(--c-bg);color:var(--c-text-sub)}
.st-g{background:var(--c-ok-light);color:var(--c-ok)}
.st-l{background:#fff;color:var(--c-text-sub);border:1px dashed var(--c-border);font-weight:400}
.hm td.c{cursor:pointer;text-align:center}
.hm td.c:hover{background:var(--c-primary-light)}
.hm td.c small{display:block;font-size:12px;color:var(--c-text-sub);margin-top:2px}
.hm th.c{text-align:center}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--c-text-sub);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.bench-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:12px 18px;margin-bottom:16px;font-size:14px}
.bench-bar b{color:var(--c-heading)}
.bench-bar .sep{width:1px;height:18px;background:var(--c-border)}
.vs{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.vs>div small{display:block;font-size:12px;color:var(--c-text-sub)}
.vs>div b{font-size:24px;font-weight:900;color:var(--c-heading);font-variant-numeric:tabular-nums}
.vs>div.mk b{color:#8a929c}
.vs .st{margin-left:auto}
.rel{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #eeeeee;font-size:13px}
.rel a{font-weight:700;text-decoration:none}
.mkt-only{font-size:13px;color:var(--c-text-sub);background:var(--c-bg);border-radius:6px;padding:8px 12px}

/* 管理 Issue */
.iss{background:#fff;border:1px solid var(--c-border);border-left:4px solid var(--c-warn);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.iss.h{border-left-color:var(--c-danger)}
.iss+.iss{margin-top:12px}
.iss-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.iss-h h3{font-size:16px;color:var(--c-heading);margin-right:auto}
.ev{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.ev span{font-size:13px;line-height:1.4;padding:2px 8px;border-radius:4px;background:var(--c-bg)}
.sol{background:#f8fafb;border-radius:6px;padding:10px 14px}
.sol>b{display:block;font-size:13px;color:var(--c-primary-dark);margin-bottom:4px}
.sol ol{list-style:none;counter-reset:s}
.sol li{counter-increment:s;display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;border-top:1px dashed #e4e7ea}
.sol li:first-child{border-top:0}
.sol li::before{content:counter(s);flex:none;width:20px;height:20px;border-radius:50%;background:var(--c-primary);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sol li span{flex:1}
.iss-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.top-iss{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--c-border);font-size:14px}
.top-iss:last-child{border-bottom:0}
.top-iss a{text-decoration:none;color:var(--c-text)}
.top-iss a:hover{color:var(--c-primary)}

/* 九宮格 */
.nine{display:grid;grid-template-columns:56px repeat(3,1fr);grid-template-rows:repeat(3,auto) 40px;gap:8px}
.nine .ax{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--c-text-sub);line-height:1.3}
.nine .ax b{color:var(--c-heading);font-weight:700}
.nine-def{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.nine-def div{background:var(--c-bg);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--c-text-sub)}
.nine-def b{display:block;color:var(--c-heading);font-size:13px;margin-bottom:2px}
.cell{background:#fafafa;border:1px solid #eeeeee;border-radius:var(--radius);padding:10px;min-height:96px}
.cell .tt{font-size:13px;font-weight:700;margin-bottom:6px}
.cell a{display:inline-block;font-size:13px;background:#fff;border:1px solid var(--c-border);border-radius:4px;padding:1px 8px;margin:2px 4px 2px 0;text-decoration:none;color:var(--c-text)}
.cell a:hover{border-color:var(--c-primary);color:var(--c-primary)}
.cell.star{background:var(--c-ok-light)}.cell.risk{background:var(--c-danger-light)}.cell.core{background:var(--c-primary-light)}

/* 發展路徑、升遷 */
.route{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:15px}
.route .node{background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:10px 14px}
.route .node b{display:block;font-size:16px}
.route .arrow{color:var(--c-primary);font-size:22px}
.plan h4{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between}
.plan h4 span{font-size:12px;color:var(--c-text-sub);font-weight:400}
.plan li{font-size:14px;margin:6px 0 0 18px}
.fitnum{font-size:22px;font-weight:900;color:var(--c-primary);font-variant-numeric:tabular-nums}
.ccard{border:1px solid var(--c-border);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;background:#fff}
.ccard.best{border-color:var(--c-primary);box-shadow:0 0 0 1px var(--c-primary)}
.ccard .jc{margin:4px 0 8px;padding-top:12px;border-top:1px solid var(--c-border)}
.ccard>.btn{margin-top:auto!important;align-self:flex-start}
.uplist{display:flex;flex-direction:column}
.up{padding:12px 0;border-bottom:1px dashed var(--c-border)}
.up:last-child{border-bottom:0}
.up-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.up-h b{margin-right:8px}
.up-gap{color:var(--c-warn);font-weight:700;white-space:nowrap}
.up-gap small{font-weight:400;margin-left:2px}
.up-bar{position:relative;height:8px;background:#eeeeee;border-radius:4px;margin:8px 0 4px}
.up-bar i{position:absolute;left:0;top:0;height:100%;background:var(--c-warn);border-radius:4px}
.up-v{display:flex;justify-content:space-between;font-size:12px;color:var(--c-text-sub)}

/* 產品啟用 */
.buy{text-align:center;padding:40px 24px;border:1px dashed #bfe7ea;background:var(--c-primary-light)}
.buy .ic{font-size:34px}
.buy h3{font-size:18px;margin:8px 0 6px;color:var(--c-heading)}
.buy p{font-size:14px;color:var(--c-text-sub);margin-bottom:14px}
.buy .need{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.buy .need a{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1px solid var(--c-primary);border-radius:8px;padding:10px 16px;text-decoration:none;color:var(--c-primary);font-weight:700;font-size:14px}
.buy .need a small{font-weight:400;font-size:12px;color:var(--c-text-sub)}
.buy .need a:hover{background:var(--c-primary);color:#fff}.buy .need a:hover small{color:#fff}
.buy .have{font-size:12px;color:var(--c-text-sub)}
.buy.mini{padding:18px 16px}
.buy.mini h3{font-size:15px}
.plan-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--c-border);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px}
.plan-bar .pg{flex:none;font-size:14px;font-weight:700;color:var(--c-heading)}
.plan-bar .pg b{font-size:22px;color:var(--c-primary)}
.plan-bar .chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.plan-bar .chips span,.plan-bar .chips a{font-size:12px;border-radius:999px;padding:3px 10px;text-decoration:none}
.plan-bar .chips .on{background:#eef6e8;color:#509e1f}
.plan-bar .chips .on::before{content:"✓ "}

function issueOf(r,k){
  const s=stat(r,k); if(!['h','m'].includes(s.lv)) return null;
  const mk=IND[S.ind].n+'優質企業';
  let title,ev,sol;
  if(k==='skill'){const low=r.skill.filter(([,m,o])=>m-o>=25),nm=low.map(x=>x[0]).join('、');
    title=`${r.name}的關鍵技能落後市場`;ev=low.map(([n,m,o])=>`${n}：本公司 ${o}%，優質企業 ${m}%`);
    sol=[[`用企業大師盤點技能，將 ${nm} 設為職務必備技能，追蹤具備率`,'org'],[`在企業學習平台開設 ${nm} 課程，指定 6 個月內完成`,'train'],[`招募時把缺少的技能列為必要條件，補足團隊技能組合`,null]];}
  if(k==='pay'){const m=mPay(r),o=r.pay[1];const e=stat(r,'ex');
    title=`${r.name}薪資水平低於市場`;ev=[`本公司中位數 ${money(o)}`,`優質企業中位數 ${money(m)}`,`差距 ${s.txt}`];if(has('sat')&&['h','m'].includes(e.lv))ev.push(`員工體驗${e.txt}，可能影響留任`);
    sol=[[`用薪酬平台取得同產業薪資報告，重新檢視${r.name}薪資帶`,'pay'],[`將調薪與績效連動，優先調整高績效者`,'perf'],[`用員工體驗調查追蹤薪酬滿意度的變化`,'sat']];}
  if(k==='comp'){const low=r.comp.filter(([,m,o])=>m-o>=5);
    title=`${r.name}的${low.map(x=>x[0]).join('、')}職能落後`;ev=low.map(([n,m,o])=>`${n}：本公司 PR ${o}，優質企業 PR ${m}`);
    sol=[[`用測評中心找出每位員工的職能落差，鎖定需加強的對象`,'assess'],[`透過發展路徑安排歷練與導師，例如「${TASK[low[0][0]]}」`,'path'],[`在企業學習平台安排「${COURSE[low[0][0]]}」課程`,'train']];}
  if(k==='exp'){title=`${r.name}平均年資偏短，經驗出現斷層`;ev=[`本公司平均 ${r.exp[1]} 年`,`優質企業平均 ${r.exp[0]} 年`,`共 ${r.n} 人`];
    sol=[[`招募時用測評中心評估特質適配，降低錯配與早期離職`,'assess'],[`用績效管理建立新人 90 天目標與導師制度`,'perf'],[`用員工體驗調查找出新人離開的原因`,'sat']];}
  if(k==='ex'){title=`${r.name}員工體驗低於市場`;ev=r.ex.map(([n,m,o])=>`${n}：本公司 ${o} 分，優質企業 ${m} 分`);
    sol=[[`用員工體驗調查找出低分構面，例如主管支持、職涯發展`,'sat'],[`針對低分構面訂定行動計畫，每季重新調查追蹤`,'sat'],[`用績效管理建立主管每月一對一面談`,'perf']];}
  if(k==='learn'){title=`${r.name}學習投入不足`;ev=[`本公司年均 ${r.learn[1]} 小時`,`優質企業年均 ${r.learn[0]} 小時`];
    sol=[[`用企業學習平台建立職務學習地圖與年度時數目標`,'train'],[`將學習完成率納入績效管理的發展目標`,'perf'],[`用企業大師盤點技能，讓學習對準技能缺口`,'org']];}
  return {id:r.id+'-'+k,r,k,lv:s.lv,title,ev,sol,mk};
}

    const hi=ppl.filter(p=>p.pot==='高').sort((a,b)=>b.ab.s-a.ab.s);
    return head('人才管理 › 人才盤點','人才盤點','依績效與綜合能力分群，找出明星型與需關注的人才。')+
      card(`人才九宮格（${isMgr()?MY_DEPT:'全公司範例'}）`,['perf','assess','org','train'],`<div class="nine-def"><div><b>橫軸｜績效</b>最近一次考核結果${tip('A+ 為高、A 為中、B+ 以下為低（績效管理）')}</div><div><b>縱軸｜綜合能力</b>職能 50%＋技能 30%＋學習 20%${tip(ABIL_TIP)}</div></div><div class="nine">${h}</div>`,`<span class="sub hint">滑過姓名看分類依據，點選看發展路徑</span>`)+
      `<div class="mt">`+card(`綜合能力高的人才（${hi.length} 位）`,['assess','org','perf','sat'],`<div class="tbl"><table class="t nw"><thead><tr><th>姓名</th><th>部門｜職位</th><th>綜合能力</th><th>近 3 年績效</th><th><span style="display:inline-flex;align-items:center;gap:4px">員工體驗${tip(EX_TIP)}</span></th><th></th></tr></thead><tbody>
        ${hi.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.dept}｜${p.title}</td><td><b>${p.ab.s}</b> 分</td><td>${p.perf.join('／')}</td><td>${has('sat')?`${p.ex} 分${p.ex<65?' <span class="badge b-warn">偏低</span>':''}`:'<span class="lock">需啟用員工體驗調查</span>'}</td><td><a class="btn btn-line btn-sm" href="#path--${p.id}">看發展路徑</a></td></tr>`).join('')}
      </tbody></table></div>`)+`</div>`;
  },

  promo(){
    const js=visJ().filter(j=>j.lv==='主管職'); if(!js.find(j=>j.id===S.job)) S.job=js[0].id;
    const j=job(S.job); const pool=PEOPLE.filter(p=>p.dept===j.dept);
    S.picks=S.picks.filter(id=>pool.some(p=>p.id===id)); if(S.picks.length<2) S.picks=pool.slice(0,3).map(p=>p.id);
    const c=S.picks.map(byId).map(p=>({p,f:fit(p,j),g:gaps(p,j)})).sort((a,b)=>b.f-a.f);
    return head('人才管理 › 升遷評估','升遷評估','以職缺畫像為標準，比較候選人的適配度、績效與落差。')+
    `<div class="card"><div class="filters" style="margin:0">職缺：<select id="promoSel">${js.map(x=>`<option value="${x.id}" ${x.id===j.id?'selected':''}>${x.name}（${x.dept}）</option>`).join('')}</select><span class="sub">候選人（2–4 位）：</span><div class="picks">${pool.map(p=>`<button class="pick ${S.picks.includes(p.id)?'on':''}" data-pick="${p.id}">${p.name}</button>`).join('')}</div></div></div>
    <div class="grid mt" style="grid-template-columns:repeat(${c.length},1fr)">${c.map((x,i)=>`<div class="ccard ${i===0?'best':''}"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:17px">${x.p.name}</b>${i===0?'<span class="badge b-ok">最適合</span>':''}</div><span class="sub">${x.p.title}｜年資 ${x.p.years} 年</span><div><span class="fitnum">${x.f}%</span> <span class="sub">職缺適配度</span></div>
      <div class="jc">
      <div><b>近 3 年績效</b><span class="cs">${x.p.perf.map(v=>`<i>${v}</i>`).join('')}</span></div>
      <div><b>綜合能力</b><span class="cs ab"><i>${x.p.pot} <em>${x.p.ab.s} 分</em></i></span></div>
      <div><b>專業技能</b><span class="cs skl">${(PERSON_SKILLS[x.p.id]||[]).map(s=>`<i>${s}</i>`).join('')||'<i>—</i>'}</span></div>
      <div><b>員工體驗</b><span class="cs">${has('sat')?`<i>${x.p.ex} 分</i>`:'<i>🔒 需啟用員工體驗調查</i>'}</span></div>
      <div><b>職能落差</b><span class="cs gp">${x.g.length?x.g.slice(0,2).map(g=>`<i>${g.d} −${g.g}</i>`).join(''):'<i class="ok">無</i>'}</span></div>
      <div><b>技能落差</b><span class="cs gp">${skillMiss(x.p,j).length?skillMiss(x.p,j).map(s=>`<i>缺 ${s}</i>`).join(''):'<i class="ok">無</i>'}</span></div>
      </div><a class="btn btn-line btn-sm" href="#path--${x.p.id}--${j.id}">看發展路徑</a></div>`).join('')}</div>
    <div class="mt">${ai(`以「${j.name}」的畫像來看，${c[0].p.name}適配度最高（${c[0].f}%），建議優先考慮；${c.slice(1).map(x=>`${x.p.name}主要落差在${x.g[0]?x.g[0].d:'—'}`).join('，')}，可透過發展路徑補強後再評估。`)}</div>`;
  },

  path(a,b){
    if(a) S.pathP=a; if(b) S.pathJ=b;
    const ppl=visP(); if(!ppl.find(p=>p.id===S.pathP)) S.pathP=ppl[0].id;
    const js=visJ(); if(!js.find(j=>j.id===S.pathJ)) S.pathJ=js[0].id;
    const p=byId(S.pathP), j=job(S.pathJ), f=fit(p,j), g=gaps(p,j).slice(0,2), sm=skillMiss(p,j), req=JOB_SKILLS[j.id]||[];
    const leg=`<div class="gleg"><span><i></i>員工目前</span><span><i class="warn"></i>未達要求</span><span><i class="req"></i>職缺要求</span></div>`;
    const bars=`${leg}<div class="bars gb">${DIMS.map((d,i)=>{const v=p.radar[i],t=j.target[i],w=v<t;return `<div class="gbar"><span>${d}</span><div class="gt"><div class="track"><span class="fill ${w?'warn':''}" data-w="${v}"></span></div><div class="track"><span class="fill req" data-w="${t}"></span></div></div><span class="gv"><b class="${w?'w':''}">${v}</b><small>${t}</small></span><span class="gd ${w?'w':''}">${w?'−'+(t-v):'✓'}</span></div>`}).join('')}</div>`;
    return head('人才管理 › 發展路徑','發展路徑','看員工離目標職缺還差什麼、該怎麼準備。')+
    `<div class="filters">員工：<select id="pathP">${ppl.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name}（${x.title}）</option>`).join('')}</select>目標職缺：<select id="pathJ">${js.map(x=>`<option value="${x.id}" ${x.id===j.id?'selected':''}>${x.name}（${x.dept}）</option>`).join('')}</select></div>
    <div class="card"><div class="route"><div class="node"><span class="sub">目前</span><b>${p.title}</b><span class="sub">${p.dept}｜年資 ${p.years} 年</span></div><span class="arrow">→</span><div class="node"><span class="sub">目標</span><b>${j.name}</b><span class="sub">${j.dept}</span></div><div style="margin-left:auto;text-align:right"><span class="sub" style="display:inline-flex;align-items:center;gap:4px">目前適配度${tip(FIT_TIP)}</span><div class="fitnum">${f}%</div></div></div></div>
    <div class="grid g2 mt">
      ${card('能力落差',['assess','org'],`<h4 class="gh">職能（軟實力）</h4>${bars}<h4 class="gh mt">技能（專業技術）</h4><div class="sk-sum">已具備 <b>${req.length-sm.length}</b> / ${req.length} 項職缺所需技能</div><div class="sk">${req.map(s=>sm.includes(s)?`<span class="no">✕ ${s}</span>`:`<span class="ok">✓ ${s}</span>`).join('')}</div>`)}
      ${card('學習與歷練建議',['train','assess'],g.length?`<div class="tipbox">💡 做中學為主、跟人學為輔、上課學補充，三種一起進行效果最好。</div><div class="plan mt"><h4>做中學 <span>主要：在工作中累積經驗</span></h4><ul>${g.map(x=>`<li>${TASK[x.d]}</li>`).join('')}</ul></div>
        <div class="plan mt"><h4>跟人學 <span>其次：請主管或前輩帶</span></h4><ul>${g.map(x=>`<li>${MENTOR[x.d]}</li>`).join('')}</ul></div>
        ${has('train')?`<div class="plan mt"><h4>上課學 <span>輔助：補足觀念與方法</span></h4><ul>${g.map(x=>`<li>${COURSE[x.d]} <button class="btn btn-line btn-sm" data-toast="已將「${COURSE[x.d]}」指派給 ${p.name}（示意）">指派</button></li>`).join('')}</ul></div>`:`<div class="plan mt"><h4>上課學 <span>輔助：補足觀念與方法</span></h4>${lockLine('train','可看到建議課程並直接指派')}</div>`}`:'<p>已達到目標職缺的能力要求，可直接列入人選。</p>')}
    </div>`;
  },

  salary(){
    const rows=DEPTS.map(d=>{const diff=Math.round((d.pay-CO_MEDIAN)/CO_MEDIAN*100);
      if(isMgr()&&d.name!==MY_DEPT) return `<tr><td>${d.name}</td><td colspan="4"><span class="lock">無權限檢視其他部門薪資</span></td></tr>`;
      return `<tr><td><b>${d.name}</b></td><td>${d.n}</td><td>${money(d.pay)}</td><td>${diff>=0?'高 '+diff:'低 '+Math.abs(diff)}%</td><td>${diff<=-15?'<span class="badge b-danger">明顯偏低</span>':diff<=-8?'<span class="badge b-warn">偏低</span>':'<span class="badge b-ok">合理</span>'}</td></tr>`}).join('');
    const under=visP().filter(p=>p.pay<DEPTS.find(d=>d.name===p.dept).pay*0.95&&p.perf[2].startsWith('A'));
    return head('人才管理 › 薪資合理性','薪資合理性','各部門與高績效員工的薪資，是否與表現相稱。','與市場的薪資比較，請看「職務對標」的薪資面向。')+
    `<div class="grid g2">${card('各部門平均月薪 vs 公司中位數',['pay','org'],`<div class="tbl"><table class="t nw"><thead><tr><th>部門</th><th>人數</th><th>平均月薪</th><th><span style="display:inline-flex;align-items:center;gap:4px">公司中位數${tip('公司中位數：'+money(CO_MEDIAN)+'。把全公司員工月薪由低到高排列，排在正中間的那個數字。')}</span></th><th><span style="display:inline-flex;align-items:center;gap:4px">狀態${tip('低於公司中位數 8% 為偏低、低於 15% 為明顯偏低。')}</span></th></tr></thead><tbody>${rows}</tbody></table></div>`)}
    ${card('高績效但薪資偏低的員工'+tip('最近一次績效 A 以上，且月薪低於部門平均 5% 以上。'),['pay','perf'],under.length?`<div class="uplist">${under.map(p=>{const avg=DEPTS.find(d=>d.name===p.dept).pay,diff=p.pay-avg,pct=Math.round(diff/avg*100),w=Math.round(p.pay/avg*100);
        return `<div class="up"><div class="up-h"><span><b>${p.name}</b><span class="sub">${p.dept}｜近一年績效 ${p.perf[2]}</span></span><span class="up-gap">低 ${Math.abs(pct)}%${isMgr()?'':`<small>（−${fmt(Math.abs(diff))} 元）</small>`}</span></div>
          <div class="up-bar"><i style="width:${w}%"></i></div>
          <div class="up-v"><span>目前 ${money(p.pay)}</span><span>部門平均 ${money(avg)}</span></div></div>`}).join('')}</div>`:'<p class="sub">目前沒有</p>')}</div>`;
  }
};

/* ===== 路由 ===== */
function setRole(r,silent){
  S.role=r; const R=ROLES[r];
  document.querySelectorAll('#whoMenu [data-role]').forEach(x=>x.classList.toggle('on',x.dataset.role===r));
  $('#av').textContent=R.av; $('#whoName').textContent=R.nm;
  if(!silent) toast(R.msg);
}
function setPlan(p,silent){
  S.plan=p;
  whoMenu.querySelectorAll('[data-plan]').forEach(x=>x.classList.toggle('on',x.dataset.plan===p));
  if(!silent) toast(p==='full'?'已切換為全部啟用：六個面向皆可對標':'已切換為部分啟用：未啟用產品的面向會鎖定');
}
function render(){
  const h=decodeURIComponent(location.hash.replace('#',''))||'home';
  const [page,a,b]=h.split('--');
  if(page==='home'&&ROLES[a]&&a!==S.role) setRole(a,true);
  if(PLANS[b]&&b!==S.plan) setPlan(b,true);
  const fn=PAGES[page]?page:'home';
  if(fn==='issues'&&a===undefined) S.irole='';
  renderNav(fn);
  const miss=missing(fn);
  const body=miss.length?head('人才管理 › '+FEAT[fn],FEAT[fn],'')+buyBox(miss,`啟用${miss.map(k=>SRC[k].prod).join('、')}，即可使用「${FEAT[fn]}」`):PAGES[fn](a,b);
  $('#main').innerHTML=`<div class="fade">${body}</div>`;
  setTimeout(()=>document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'),50);
  bind();
  if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.side')) document.activeElement.blur();
  const go=b&&document.getElementById('go-'+a+'-'+b);
  if(go&&location.hash!==render.last){render.last=location.hash;setTimeout(()=>{go.scrollIntoView({behavior:'smooth',block:'start'});go.classList.add('flash');setTimeout(()=>go.classList.remove('flash'),1800)},80);}
  else if(location.hash!==render.last){window.scrollTo(0,0);render.last=location.hash;}
}
function bind(){
  const is=$('#indSel'); if(is) is.onchange=()=>{S.ind=is.value;toast('已切換對標產業：'+IND[S.ind].n);render()};
  const ir=$('#iroleSel'); if(ir) ir.onchange=()=>{location.hash='issues--'+ir.value};
  document.querySelectorAll('[data-idim]').forEach(b=>b.onclick=()=>{S.idim=b.dataset.idim;render()});
  document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{S.track.push(b.dataset.track);toast('已列入改善計畫（示意）');const y=window.scrollY;render();window.scrollTo(0,y)});
  const ps=$('#promoSel'); if(ps) ps.onchange=()=>{S.job=ps.value;S.picks=[];render()};
  const pp=$('#pathP'), pj=$('#pathJ');
  if(pp) pp.onchange=()=>{S.pathP=pp.value; location.hash='path--'+S.pathP+'--'+S.pathJ};
  if(pj) pj.onchange=()=>{S.pathJ=pj.value; location.hash='path--'+S.pathP+'--'+S.pathJ};
  document.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.pick;
    if(S.picks.includes(id)){if(S.picks.length<=2){toast('至少需要 2 位候選人');return}S.picks=S.picks.filter(x=>x!==id)}
    else{if(S.picks.length>=4){toast('最多比較 4 位候選人');return}S.picks.push(id)} render();});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toast]'); if(t){e.preventDefault();toast(t.dataset.toast);return}
  if(e.target.closest('a,button,select,input,.tip')) return;
  const g=e.target.closest('[data-go]'); if(g) location.hash=g.dataset.go;
});
const whoMenu=$('#whoMenu'), whoBtn=$('#whoBtn');
whoBtn.onclick=e=>{e.stopPropagation();whoMenu.hidden=!whoMenu.hidden;whoBtn.setAttribute('aria-expanded',String(!whoMenu.hidden))};
document.addEventListener('click',e=>{if(!e.target.closest('.who')){whoMenu.hidden=true;whoBtn.setAttribute('aria-expanded','false')}});
whoMenu.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{whoMenu.hidden=true;setRole(b.dataset.role);if(location.hash==='#home')render();else location.hash='#home'});
whoMenu.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{whoMenu.hidden=true;setPlan(b.dataset.plan);render()});
document.querySelector('a.why').addEventListener('click',e=>{e.preventDefault();location.href=new URL('./',location.href).href;});
window.addEventListener('hashchange',render);
render();
</script>
<!-- TO TOP -->
<style>
.totop{position:fixed;right:24px;bottom:24px;z-index:80;width:48px;height:48px;border-radius:50%;border:1px solid #dddddd;background:#fff;color:#7e7e7e;box-shadow:0 2px 8px 0 rgba(41,41,41,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .2s,transform .2s,visibility .2s,color .2s,border-color .2s}
.totop.show{opacity:1;visibility:visible;transform:none}
.totop:hover,.totop:focus-visible{color:#00afb8;border-color:#00afb8;outline:none}
.totop svg{width:18px;height:18px}
.totop span{font-size:10px;font-weight:700;line-height:1}
@media (max-width:560px){.totop{right:16px;bottom:16px;width:44px;height:44px}}
</style>
<button class="totop" id="toTop" type="button" aria-label="回到頁面頂端" title="回到頂端"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg><span>TOP</span></button>
<script>
(function(){var b=document.getElementById('toTop');
  function t(){b.classList.toggle('show',window.scrollY>400)}
  window.addEventListener('scroll',t,{passive:true});t();
  b.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
})();
</script>
</body>
